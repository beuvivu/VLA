<script>(function(){var d=document.querySelector(".ui-dock");if(!d)return;document.documentElement.classList.add("ui-js");var gs=Array.prototype.slice.call(d.querySelectorAll(".ui-dock-group"));function set(g,o){g.classList.toggle("ui-open",o);var b=g.querySelector(".ui-dock-btn");if(b)b.setAttribute("aria-expanded",o?"true":"false")}function shut(k){for(var i=0;i<gs.length;i++)if(gs[i]!==k)set(gs[i],false)}d.addEventListener("click",function(e){var b=e.target.closest&&e.target.closest(".ui-dock-btn");if(!b)return;var g=b.closest(".ui-dock-group");if(!g)return;var o=!g.classList.contains("ui-open");shut(g);set(g,o)});document.addEventListener("click",function(e){if(!(e.target.closest&&e.target.closest(".ui-dock")))shut(null)});document.addEventListener("keydown",function(e){if(e.key!=="Escape")return;var g=d.querySelector(".ui-dock-group.ui-open");if(!g)return;var b=g.querySelector(".ui-dock-btn");shut(null);if(b)b.focus()});d.addEventListener("focusout",function(e){if(!e.relatedTarget||!d.contains(e.relatedTarget))shut(null)})})();</script>
