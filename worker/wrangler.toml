name = "vla-live"
main = "src/index.js"
compatibility_date = "2026-09-01"

# ĐỒNG HỒ. Giờ UTC; Việt Nam là UTC+7.
#
# 11:08-11:59 UTC = 18:08-18:59 giờ VN, mỗi phút một lần trong khung quay số.
# 12:00-12:55 UTC = 19:00-19:55 giờ VN, năm phút một lần, phòng kỳ quay muộn.
#
# Khác hẳn cron của GitHub: lịch của Cloudflare nổ đúng phút đã đặt. Đó là
# toàn bộ lý do thành phần này tồn tại.
[triggers]
crons = [
  "8-59 11 * * *",
  "*/5 12 * * *",
]

# Ngưỡng đồng thuận: số NHÓM nguồn độc lập phải ủng hộ một giá trị thì nó mới ĐÃ XÁC MINH.
# Phải khớp bản Python. Từ 13-10-2026 là 1: một nguồn chính, dự phòng chỉ khi nó hỏng; khi
# hai nguồn dự phòng cùng được đọc mà nói khác nhau, ô ấy là xung đột, không được xác minh.
[vars]
MIN_AGREEMENT = "1"

# Cron nạp lớp bù cho API Sổ kết quả (/api/v1/traditional-results) từ sổ cuộn 500 ngày của
# nguồn dự phòng: chỉ khi lịch sử chuẩn còn thiếu ngày, cách nhau tối thiểu 10 phút. Yêu cầu
# của khách không bao giờ gọi nguồn ấy. Bỏ dòng này thì API chỉ trả lịch sử chuẩn.
TRADITIONAL_FALLBACK_REFRESH = "on"

# Nơi cất ảnh chụp giữa các lần cron gọi. Worker không có bộ nhớ riêng giữa
# các lượt chạy, nên không có chỗ này thì cron thu thập xong sẽ mất trắng.
# Tạo bằng: npx wrangler kv namespace create LIVE
# (wrangler cũ dùng cú pháp hai chấm: npx wrangler kv:namespace create LIVE)
[[kv_namespaces]]
binding = "LIVE"
id = "THAY_BANG_ID_KV_CUA_BAN"
