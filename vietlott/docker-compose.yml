name: vietlott-quant-engine

services:
  api:
    build: .
    image: vietlott-quant-engine:latest
    ports:
      - "8000:8000"
    environment:
      VQE_SOURCE: auto                   # vietlott (Vietnamese IP only) → nhanaz → github_mirror (README §1.7)
      VQE_AUTO_UPDATE_ENABLED: "true"   # per-product windows, restart recovery, bounded retries
      VQE_HTTP_BACKEND: curl_cffi
      TZ: Asia/Ho_Chi_Minh
      VQE_LOG_LEVEL: INFO
    volumes:
      - vqe-data:/app/data               # DuckDB file + Parquet exports
    restart: unless-stopped

  # Compatibility service for model/finance refresh only. Draw results are
  # updated by the API's independent per-product scheduler above.
  scheduler:
    image: curlimages/curl:8.10.1
    depends_on:
      api:
        condition: service_healthy
    environment:
      REFRESH_EVERY_SECONDS: "21600"
    entrypoint:
      - /bin/sh
      - -c
      - |
        while true; do
          for g in mega645 power655 lotto535; do
            curl -fsS --max-time 180 -X POST "http://api:8000/games/$$g/prizes/sync" -H 'Content-Type: application/json' -d '{"source":"auto"}' || echo "prize refresh $$g failed"
          done
          for p in mega645 power655 lotto535 keno bingo18 max3d max3dpro; do
            curl -fsS --max-time 600 "http://api:8000/forecast/$$p?record=true" > /dev/null || echo "forecast $$p failed"
          done
          sleep "$$REFRESH_EVERY_SECONDS"
        done
    restart: unless-stopped

  # One-off research job: `make docker-job` (or
  # `VQE_UID=$(id -u) VQE_GID=$(id -g) docker compose --profile jobs run --rm backtest`).
  # ./reports is a bind mount and keeps the HOST owner and mode, so on native Linux
  # Docker the image's `vqe` user (UID 10001) cannot write it. The job therefore runs
  # as the host user; everything else it writes lives under /tmp, which any UID can
  # write. The default 10001 keeps Docker Desktop (which remaps ownership) working.
  backtest:
    image: vietlott-quant-engine:latest
    profiles: ["jobs"]
    user: "${VQE_UID:-10001}:${VQE_GID:-10001}"
    environment:
      VQE_DATA_DIR: /tmp/vqe-jobdata     # separate DuckDB file: never contends with the API's lock
      HOME: /tmp                         # an arbitrary host UID has no home directory in the image
    volumes:
      - ./reports:/app/reports
    command:
      - /bin/sh
      - -c
      - |
        vietlott sync --game all --source file --path /app/seed &&
        (vietlott sync --game all || echo "online sync failed, using bundled snapshot") &&
        (vietlott prizes --game all --source auto || echo "online prize sync failed, using bundled prize data") &&
        (vietlott products sync --source auto || echo "product sync failed, using bundled histories") &&
        vietlott market --out /app/reports/calibration &&
        VQE_CALIBRATION_DIR=/app/reports/calibration python scripts/market_report.py &&
        python scripts/bao_report.py &&
        python scripts/products_report.py &&
        vietlott products analyze --product all &&
        vietlott analyze --game all &&
        vietlott inference --game all --out /app/reports &&
        vietlott backtest --game all --tickets 5 --out /app/reports

volumes:
  vqe-data:
