<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; connect-src 'self'; font-src 'self'; form-action 'none'; frame-src 'none'; img-src 'self' data:; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'" />
  <meta name="referrer" content="no-referrer">
  <title>Kết quả XSMB trực tiếp</title>
  <link rel="stylesheet" href="assets/critical.css" />
  <link rel="stylesheet" href="assets/ui.css" />
  <link rel="stylesheet" href="assets/ui-visual-system.css" media="all" data-ui-visual-system />
  <style>
    *{box-sizing:border-box}
    body.live-console{
      margin:0;
      min-height:100vh;
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
      background:linear-gradient(135deg,#F4F5FF 0%,#EAEBFF 48%,#E8ECFF 100%);
      color:#0f172a;
      padding-bottom:calc(var(--ui-dock-h,64px) + env(safe-area-inset-bottom) + 1rem);
    }
    .wrap{
      max-width:1280px;margin:0 auto;padding:24px 18px 36px;
      display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px;
    }
    .wrap>.top{grid-column:1/-1;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;
      padding:1rem 1.15rem;border:1px solid rgba(255,255,255,.94);border-radius:20px;
      background:rgba(255,255,255,.86);box-shadow:0 8px 30px rgba(15,23,42,.05)}
    h1{margin:0;font-size:clamp(1.25rem,2.5vw,1.5rem);letter-spacing:-.02em}
    .muted{color:#475569;font-size:13px}
    a{color:#4f46e5;text-decoration:none}
    a:hover{text-decoration:underline}
    .card{
      margin:0;padding:16px;border-radius:20px;
      background:rgba(255,255,255,.9);border:1px solid #dbe3f0;
      box-shadow:0 8px 30px rgba(15,23,42,.045);
    }
    .live-status-card{grid-column:span 4;align-self:start}
    .live-results-card{grid-column:span 8;grid-row:2/span 2}
    .live-sources-card{grid-column:span 4;align-self:start}
    .top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
    .bar{height:9px;background:#e2e8f0;border-radius:10px;overflow:hidden}
    .fill{height:100%;background:linear-gradient(90deg,#4f46e5,#059669);width:0;transition:width .45s ease}
    .badge{display:inline-block;border:1px solid #dbe3f0;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600}
    .badge.ok{border-color:#a7f3d0;color:#059669}
    .badge.warn{border-color:#fed7aa;color:#d97706}
    .foot{display:flex;gap:14px;flex-wrap:wrap;color:#64748b;font-size:12px;margin-top:10px}
    #results{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:16px}
    .prize{display:grid;grid-template-columns:104px 1fr;gap:10px 14px;align-items:center;padding:9px 0;border-bottom:1px solid #e2e8f0}
    .prize:last-child{border-bottom:0}
    .prize[data-prize=special],.prize[data-prize=prize3],.prize[data-prize=prize5],.prize[data-prize=prize7]{grid-column:1/-1}
    .prize-label{display:flex;align-items:center;gap:8px;color:#475569;font-weight:700;font-size:14px}
    .dot{width:7px;height:7px;border-radius:50%;background:#94a3b8;flex:none}
    .prize.is-waiting .dot{background:#d97706;animation:pulse 1.6s ease-in-out infinite}
    .prize.is-live .dot{background:#4f46e5;animation:pulse 1s ease-in-out infinite}
    .prize.is-done .dot{background:#059669;animation:none}
    .slots{display:flex;flex-wrap:wrap;gap:8px}
    .slot{position:relative;min-width:var(--w,64px);height:38px;display:flex;align-items:center;justify-content:center;
      padding:0 10px;border-radius:10px;border:1px solid #dbe3f0;background:#fff;
      font:700 19px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.06em;color:#0f172a}
    .slot.is-empty{color:#64748b;background:#E2E8F0;border-style:dashed;
      background-image:repeating-linear-gradient(135deg,transparent 0 7px,rgba(156,163,175,.38) 7px 8px)}
    .slot.is-special{font-size:26px;min-width:112px;height:48px;color:#DC2626;border-color:#f87171;background:#FEE2E2}
    .slot.is-new{animation:reveal .5s cubic-bezier(.2,.8,.3,1) both}
    .slot.is-fresh{border-color:#4f46e5;box-shadow:0 0 0 2px rgba(79,70,229,.18)}
    @keyframes reveal{0%{opacity:0;transform:translateY(-8px) scale(.94)}100%{opacity:1;transform:none}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
    .src{display:grid;grid-template-columns:34px 1fr 78px;gap:8px;font-size:12px;padding:5px 0;border-bottom:1px solid #e2e8f0;color:#475569}
    .src:last-child{border-bottom:0}
    @media(max-width:900px){
      .live-status-card,.live-results-card,.live-sources-card{grid-column:1/-1;grid-row:auto}
      #results{grid-template-columns:1fr}
      .prize{grid-column:1/-1!important}
    }
    @media(max-width:620px){
      .wrap{padding:12px;gap:10px}
      .card{border-radius:16px;padding:13px}
      .prize{grid-template-columns:64px 1fr}
      .slot{min-width:56px;height:34px;font-size:16px}
      .slot.is-special{font-size:21px;min-width:92px;height:42px}
    }
    @media(prefers-reduced-motion:reduce){
      .slot.is-new{animation:none}.prize .dot{animation:none!important}.fill{transition:none}
    }
  </style>
</head>
<body data-ui-page="live" class="live-console">
  <div class="wrap">
    <div class="top live-hero">
      <div>
        <h1>Kết quả XSMB gần thời gian thực</h1>
        <div class="muted">Vận hành trên GitHub · đồng thuận nhiều nguồn theo từng ô · các số hiện lần lượt ngay khi lấy được</div>
      </div>
      <a href="index.html">Bảng điều khiển</a>
    </div>
    <div class="card live-status-card">
      <div class="top"><b id="status">Đang tải…</b><span class="badge" id="verify">—</span></div>
      <div id="checked" class="muted" style="margin:8px 0">—</div>
      <div class="bar"><div class="fill" id="bar"></div></div>
      <div class="foot">
        <span id="progress">—</span>
        <span id="cadence">—</span>
      </div>
    </div>
    <div class="card live-results-card">
      <div id="results" aria-live="polite" aria-atomic="false"></div>
    </div>
    <div class="card live-sources-card">
      <b>Nguồn</b>
      <div id="sources" style="margin-top:8px"></div>
      <div id="conflicts" class="muted" style="margin-top:10px"></div>
    </div>
  </div>
  <script>window.LIVE_WORKER_URL='';</script>
  <script src="assets/live-board.js" defer></script>
  <script src="assets/ui-dock.js" defer></script>
</body>
</html>
