<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kết quả XSMB trực tiếp</title>
<style>body{font-family:system-ui,Segoe UI,Arial;margin:0;background:#08111f;color:#e5edf8}.wrap{max-width:920px;margin:auto;padding:20px}.card{background:#0d1b2d;border:1px solid #24354b;border-radius:16px;padding:16px;margin:12px 0}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.muted{color:#93a4b8;font-size:13px}.bar{height:9px;background:#17283b;border-radius:10px;overflow:hidden}.fill{height:100%;background:#e5edf8;width:0}.grid{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;align-items:center}.label{color:#9fb3c8;font-weight:700}.nums{font:700 19px ui-monospace,Consolas,monospace;word-spacing:12px}.special{font-size:27px}.badge{display:inline-block;border:1px solid #39506a;border-radius:999px;padding:4px 9px;font-size:12px}.ok{border-color:#4f8069}.warn{border-color:#8b6b32}.src{display:grid;grid-template-columns:30px 1fr 90px;gap:7px;font-size:12px;padding:4px 0;border-bottom:1px solid #17283b}@media(max-width:600px){.grid{grid-template-columns:70px 1fr}.nums{font-size:16px}.special{font-size:22px}}</style></head><body><div class="wrap">
<div class="top"><div><h1 style="margin:0">Kết quả XSMB gần thời gian thực</h1><div class="muted">Vận hành trên GitHub · đồng thuận nhiều nguồn theo từng ô · tự làm mới sau 10 giây</div></div><a href="index.html" style="color:#b7d4ff">Bảng điều khiển</a></div>
<div class="card"><div class="top"><b id="status">Đang tải…</b><span class="badge" id="verify">—</span></div><div id="checked" class="muted" style="margin:7px 0">—</div><div class="bar"><div class="fill" id="bar"></div></div><div id="progress" class="muted" style="margin-top:7px">—</div></div>
<div class="card" id="results"></div><div class="card"><b>Nguồn</b><div id="sources" style="margin-top:8px"></div><div id="conflicts" class="muted" style="margin-top:8px"></div></div>
</div><script>
const labels={special:'ĐB',prize1:'G1',prize2:'G2',prize3:'G3',prize4:'G4',prize5:'G5',prize6:'G6',prize7:'G7'};
function rawUrl(){if(window.LIVE_RAW_URL)return window.LIVE_RAW_URL;const h=location.hostname;if(h.endsWith('.github.io')){const owner=h.split('.')[0];const first=location.pathname.split('/').filter(Boolean)[0];const repo=first||`${owner}.github.io`;return `https://raw.githubusercontent.com/${owner}/${repo}/live/live.json`;}return 'data/live.json';}
async function load(){try{const r=await fetch(rawUrl()+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error(r.status);const d=await r.json();const statusLabels={waiting:'ĐANG CHỜ',partial:'ĐANG CẬP NHẬT',complete:'HOÀN TẤT',complete_verified:'ĐÃ XÁC MINH'};const st=String(d.status||'waiting');document.getElementById('status').textContent=`${d.draw_date||''} · ${statusLabels[st]||st.toUpperCase()}`;document.getElementById('checked').textContent=`Cập nhật: ${d.checked_at_local||'-'}`;document.getElementById('bar').style.width=(d.progress_percent||0)+'%';document.getElementById('progress').textContent=`${d.received_values||0}/${d.expected_values||27} giá trị · hoàn thành ${d.progress_percent||0}%`;const v=document.getElementById('verify');v.textContent=`xác minh ${d.verification_percent||0}%`;v.className='badge '+(d.verified_complete?'ok':'warn');let html='<div class="grid">';for(const k of Object.keys(labels)){const val=(d.prizes?.[k]||[]).join('  ')||'—';html+=`<div class="label">${labels[k]}</div><div class="nums ${k==='special'?'special':''}">${val}</div>`;}html+='</div>';document.getElementById('results').innerHTML=html;document.getElementById('sources').innerHTML=(d.source_status||[]).map(s=>`<div class="src"><span>#${s.priority}</span><span>${s.source}</span><span>${s.received_values}/27</span></div>`).join('');document.getElementById('conflicts').textContent=(d.conflicts||[]).length?`Đang có bất đồng nguồn: ${(d.conflicts||[]).join(', ')}`:'Không phát hiện bất đồng nguồn ở các ô đã xác minh.';}catch(e){document.getElementById('status').textContent='Chưa lấy được dữ liệu trực tiếp';}}
load();setInterval(load,10000);
</script></body></html>
