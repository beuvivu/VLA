<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; connect-src 'self' https://raw.githubusercontent.com; font-src 'self'; form-action 'none'; frame-src 'none'; img-src 'self' data:; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'">
  <meta name="referrer" content="no-referrer">
  <title>Kết quả XSMB trực tiếp</title>
  <style>
    body{font-family:system-ui,Segoe UI,Arial;margin:0;background:#08111f;color:#e5edf8}
    .wrap{max-width:920px;margin:auto;padding:20px}
    .card{background:#0d1b2d;border:1px solid #24354b;border-radius:16px;padding:16px;margin:12px 0}
    .top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .muted{color:#93a4b8;font-size:13px}
    .bar{height:9px;background:#17283b;border-radius:10px;overflow:hidden}
    .fill{height:100%;background:#e5edf8;width:0}
    .grid{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;align-items:center}
    .label{color:#9fb3c8;font-weight:700}
    .nums{font:700 19px ui-monospace,Consolas,monospace;word-spacing:12px}
    .special{font-size:27px}
    .badge{display:inline-block;border:1px solid #39506a;border-radius:999px;padding:4px 9px;font-size:12px}
    .ok{border-color:#4f8069}
    .warn{border-color:#8b6b32}
    .src{display:grid;grid-template-columns:30px 1fr 90px;gap:7px;font-size:12px;padding:4px 0;border-bottom:1px solid #17283b}
    @media(max-width:600px){.grid{grid-template-columns:70px 1fr}.nums{font-size:16px}.special{font-size:22px}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <h1 style="margin:0">Kết quả XSMB gần thời gian thực</h1>
        <div class="muted">Vận hành trên GitHub · đồng thuận nhiều nguồn theo từng ô · tự làm mới sau 10 giây</div>
      </div>
      <a href="index.html" style="color:#b7d4ff">Bảng điều khiển</a>
    </div>
    <div class="card">
      <div class="top"><b id="status">Đang tải…</b><span class="badge" id="verify">—</span></div>
      <div id="checked" class="muted" style="margin:7px 0">—</div>
      <div class="bar"><div class="fill" id="bar"></div></div>
      <div id="progress" class="muted" style="margin-top:7px">—</div>
    </div>
    <div class="card" id="results"></div>
    <div class="card">
      <b>Nguồn</b>
      <div id="sources" style="margin-top:8px"></div>
      <div id="conflicts" class="muted" style="margin-top:8px"></div>
    </div>
  </div>
  <script>
    const labels = {special:'ĐB',prize1:'G1',prize2:'G2',prize3:'G3',prize4:'G4',prize5:'G5',prize6:'G6',prize7:'G7'};

    function rawUrl() {
      if (window.LIVE_RAW_URL) return window.LIVE_RAW_URL;
      const host = location.hostname;
      if (host.endsWith('.github.io')) {
        const owner = host.split('.')[0];
        const first = location.pathname.split('/').filter(Boolean)[0];
        const repo = first || `${owner}.github.io`;
        return `https://raw.githubusercontent.com/${owner}/${repo}/live/live.json`;
      }
      return 'data/live.json';
    }

    function boundedNumber(value, minimum, maximum, fallback = 0) {
      const number = Number(value);
      return Number.isFinite(number) ? Math.min(maximum, Math.max(minimum, number)) : fallback;
    }

    function textElement(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      node.textContent = String(text ?? '');
      return node;
    }

    function renderResults(prizes) {
      const grid = textElement('div', 'grid', '');
      for (const key of Object.keys(labels)) {
        const rawValues = Array.isArray(prizes?.[key]) ? prizes[key] : [];
        const values = rawValues.map(value => String(value)).join('  ') || '—';
        grid.append(
          textElement('div', 'label', labels[key]),
          textElement('div', `nums ${key === 'special' ? 'special' : ''}`, values)
        );
      }
      document.getElementById('results').replaceChildren(grid);
    }

    function renderSources(sourceStatus) {
      const container = document.getElementById('sources');
      const fragment = document.createDocumentFragment();
      const rows = Array.isArray(sourceStatus) ? sourceStatus : [];
      for (const source of rows) {
        const row = textElement('div', 'src', '');
        row.append(
          textElement('span', '', `#${source?.priority ?? '—'}`),
          textElement('span', '', source?.source ?? 'Nguồn không xác định'),
          textElement('span', '', `${source?.received_values ?? 0}/27`)
        );
        fragment.appendChild(row);
      }
      container.replaceChildren(fragment);
    }

    async function load() {
      try {
        const response = await fetch(`${rawUrl()}?t=${Date.now()}`, {cache:'no-store'});
        if (!response.ok) throw new Error(String(response.status));
        const data = await response.json();
        const statusLabels = {waiting:'ĐANG CHỜ',partial:'ĐANG CẬP NHẬT',complete:'HOÀN TẤT',complete_verified:'ĐÃ XÁC MINH'};
        const state = String(data.status || 'waiting');
        const progress = boundedNumber(data.progress_percent, 0, 100);
        const verification = boundedNumber(data.verification_percent, 0, 100);
        const received = boundedNumber(data.received_values, 0, 27);

        document.getElementById('status').textContent = `${data.draw_date || ''} · ${statusLabels[state] || state.toUpperCase()}`;
        document.getElementById('checked').textContent = `Cập nhật: ${data.checked_at_local || '-'}`;
        document.getElementById('bar').style.width = `${progress}%`;
        document.getElementById('progress').textContent = `${received}/27 giá trị · hoàn thành ${progress}%`;
        const verify = document.getElementById('verify');
        verify.textContent = `xác minh ${verification}%`;
        verify.className = `badge ${data.verified_complete === true ? 'ok' : 'warn'}`;

        renderResults(data.prizes);
        renderSources(data.source_status);
        const conflicts = Array.isArray(data.conflicts) ? data.conflicts.map(String) : [];
        document.getElementById('conflicts').textContent = conflicts.length
          ? `Đang có bất đồng nguồn: ${conflicts.join(', ')}`
          : 'Không phát hiện bất đồng nguồn ở các ô đã xác minh.';
      } catch (error) {
        document.getElementById('status').textContent = 'Chưa lấy được dữ liệu trực tiếp';
      }
    }

    load();
    setInterval(load, 10000);
  </script>
</body>
</html>
