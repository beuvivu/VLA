name: Đo khung ứng dụng trang tham chiếu

# CHẠY TAY, KHÔNG CÓ LỊCH.
#
# Vì sao cần, dù đã có `inspect-reference-design.yml`: workflow kia đọc CSS
# dạng VĂN BẢN. Cách ấy hỏng với một dashboard — đã đo trên NexLink: trang nạp
# mười biểu định kiểu, tám cái đầu là thư viện icon, nên bản đọc thu về 0 biến
# chủ đề, 0 quy tắc `body` và một bộ xương rỗng.
#
# Workflow này chạy Chromium thật và hỏi `getComputedStyle`: số đo là thứ
# người dùng nhìn thấy sau khi mọi biểu định kiểu đã hoà vào nhau.
#
# Chỉ ĐỌC và in số đo ra log. Không commit, không tải hiện vật, không lưu
# HTML/CSS/hình của trang vào kho.

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Danh sách URL https, cách nhau bằng dấu phẩy"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: inspect-reference-shell
  cancel-in-progress: true

jobs:
  inspect:
    name: Đo hai cấp điều hướng, thanh trên và trạng thái thu/mở
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - run: python -m pip install --no-cache-dir playwright

      - run: python -m playwright install --with-deps chromium

      - name: Đo bố cục đã render
        env:
          URLS: ${{ inputs.urls }}
        run: python scripts/inspect_reference_shell.py

      # TẠM: `inspect-reference-icons.yml` chưa dispatch được vì GitHub đòi
      # tệp workflow phải có trên nhánh mặc định mới đăng ký. Chạy nhờ ở đây
      # để lấy số đo; gỡ bước này khi workflow kia đã lên nhánh mặc định.
      - name: Đo biểu tượng đã render
        env:
          URLS: ${{ inputs.urls }}
        run: python scripts/inspect_reference_icons.py
