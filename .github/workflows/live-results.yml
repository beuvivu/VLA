name: Near-live XSMB results

on:
  workflow_dispatch:
  schedule:
    # UTC only. Vietnam is UTC+7. Start at 18:04 local.
    - cron: "4 11 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: live-xsmb-window
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      POLL_SECONDS: "25"
      MAX_SECONDS: "2700"
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-live.txt

      - name: Install live dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-live.txt

      - name: Poll sources and force-publish one-file live branch
        id: poll
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          started="$(date +%s)"
          previous_payload_hash=""
          verified="false"
          while true; do
            python src/live_sync.py --out /tmp/live.json --min-agreement 2

            # Ignore checked_at timestamps when deciding whether the user-visible
            # payload changed, so we do not create needless force-pushes.
            payload_hash="$(python - <<'PY'
          import hashlib, json
          p=json.load(open('/tmp/live.json', encoding='utf-8'))
          p.pop('checked_at_utc', None); p.pop('checked_at_local', None)
          print(hashlib.sha256(json.dumps(p, sort_keys=True, ensure_ascii=False).encode()).hexdigest())
          PY
          )"

            if [[ "$payload_hash" != "$previous_payload_hash" ]]; then
              blob="$(git hash-object -w /tmp/live.json)"
              tree="$(printf '100644 blob %s\tlive.json\n' "$blob" | git mktree)"
              commit="$(printf 'live: XSMB snapshot\n' | git commit-tree "$tree")"
              git push --force origin "$commit:refs/heads/live"
              previous_payload_hash="$payload_hash"
            fi

            status="$(python -c "import json; print(json.load(open('/tmp/live.json'))['status'])")"
            if [[ "$status" == "complete_verified" ]]; then
              echo "Verified complete result reached."
              verified="true"
              break
            fi

            now="$(date +%s)"
            if (( now - started >= MAX_SECONDS )); then
              echo "Live polling window finished."
              break
            fi
            sleep "$POLL_SECONDS"
          done

          echo "verified=${verified}" >> "$GITHUB_OUTPUT"

      - name: Trigger canonical daily finalization immediately
        if: steps.poll.outputs.verified == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["REPOSITORY"]
          branch = os.environ.get("DEFAULT_BRANCH") or "main"
          url = f"https://api.github.com/repos/{repo}/actions/workflows/update-data.yml/dispatches"
          payload = json.dumps({"ref": branch}).encode("utf-8")
          req = urllib.request.Request(
              url,
              data=payload,
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(req, timeout=20) as resp:
              if resp.status not in (204,):
                  raise RuntimeError(f"workflow dispatch failed: HTTP {resp.status}")
          print("Daily finalization dispatched after verified live result.")
          PY
