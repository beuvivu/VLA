name: Kết quả XSMB gần thời gian thực

# Vì sao có nhiều mốc và vì sao chúng ở phút lẻ
# --------------------------------------------------
# GitHub chạy workflow theo lịch ở mức "cố gắng tốt nhất", và trên kho này độ
# trễ đo được là 2,5–4,5 GIỜ: mốc 11:00 UTC (18:00 giờ VN, trước kỳ quay) thực
# tế nổ lúc 13:39–15:27 UTC, tức 20:39–22:26 giờ VN. Khi đó kỳ quay đã xong từ
# lâu nên vòng thăm dò lấy được kết quả hoàn tất ngay lần đầu rồi thoát sau ~20
# giây — dữ liệu vẫn đúng nhưng về muộn vài tiếng, và người xem không thấy số
# hiện dần.
#
# Hai biện pháp ở đây chỉ giảm xác suất trượt chứ KHÔNG loại bỏ được độ trễ:
#   1. Nhiều mốc trải từ đầu giờ chiều: chỉ cần một mốc rơi đúng khung quay.
#   2. Phút lẻ: hàng đợi của GitHub dồn nặng nhất ở phút :00 và :30.
# Cách chắc chắn là gọi từ bộ lập lịch bên ngoài — xem repository_dispatch bên
# dưới và hướng dẫn trong tài liệu.
on:
  workflow_dispatch:
  repository_dispatch:
    # Cho phép một bộ lập lịch bên ngoài kích hoạt đúng giờ, không qua hàng đợi
    # lịch của GitHub. Đây là đường duy nhất chạy đúng giờ một cách chắc chắn.
    types: [live-window]
  schedule:
    - cron: "37 6 * * *"
    - cron: "43 7 * * *"
    - cron: "17 8 * * *"
    - cron: "53 8 * * *"
    - cron: "23 9 * * *"
    - cron: "47 9 * * *"
    - cron: "13 10 * * *"
    - cron: "41 10 * * *"
    - cron: "7 11 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: live-xsmb-window
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    # Phải lớn hơn MAX_SECONDS (60 phút) cộng thời gian checkout/cài đặt.
    # Trước đây job bị giết ở phút 50 trong khi vòng thăm dò được cấp 60 phút,
    # nên với kỳ quay muộn (sau 18:50 giờ VN) job chết giữa chừng và bước
    # "kích hoạt hoàn tất dữ liệu ngày" — vốn có điều kiện verified == 'true' —
    # không bao giờ chạy, khiến dữ liệu ngày phải chờ cron kế tiếp.
    timeout-minutes: 70
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      TZ: Asia/Ho_Chi_Minh
      POLL_SECONDS: "15"
      MAX_SECONDS: "3600"
      VLA_CACHE_BUST: ${{ github.run_id }}
    steps:
      - name: Lấy nhánh mặc định
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Thiết lập Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Cài đặt thư viện cho dữ liệu trực tiếp
        run: |
          python -m pip install --upgrade --no-cache-dir pip
          python -m pip install --no-cache-dir -r requirements-live.txt

      - name: Thăm dò nguồn và xuất bản nhánh live một tệp
        id: poll
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Nếu job khởi động TRƯỚC khung quay, chờ tới lúc bắt đầu rồi mới thăm
          # dò, để số hiện dần đúng lúc thay vì đăng một ảnh chụp rỗng. Chỉ chờ
          # tối đa 90 phút: mốc nào rơi quá sớm thì thoát để mốc sau xử lý, thay
          # vì giữ runner hàng giờ.
          window_start_min=$((18 * 60 + 8))
          max_wait_seconds=$((90 * 60))
          waited=0
          while true; do
            # Đọc đồng hồ MỘT lần và ép cơ số 10. `date +%H` trả "08", "09"
            # có số 0 đứng đầu, và trong $(( )) bash đọc chúng là hệ bát
            # phân: "08" không hợp lệ. Bash 5.2 khi ấy bỏ ngang CẢ vòng
            # `while` và chạy tiếp sau `done` — `set -e` không bắt được — nên
            # lượt nổ lúc 17:08, 16:09 hay trong giờ 08, 09 bỏ qua bước chờ,
            # thăm dò ngay giờ trống rồi hết 60 phút đúng lúc kỳ quay bắt
            # đầu. Hai lần gọi `date` riêng còn có thể vắt qua ranh giới phút.
            hhmm="$(date +%H%M)"
            now_min=$(( 10#${hhmm:0:2} * 60 + 10#${hhmm:2:2} ))
            (( now_min >= window_start_min )) && break
            gap=$(( (window_start_min - now_min) * 60 ))
            if (( gap > max_wait_seconds )); then
              echo "Còn $((gap / 60)) phút mới tới khung quay — quá sớm, để mốc sau xử lý."
              echo "verified=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Chờ $((gap / 60)) phút tới khung quay 18:08 giờ Việt Nam…"
            sleep "$gap"
            waited=$((waited + gap))
          done

          # Lượt #164 chết vì GitHub trả HTTP 500 MỘT lần khi đẩy ảnh chụp:
          # với `set -e`, một lỗi thoáng qua giết cả vòng thăm dò 60 phút.
          # Mỗi ảnh chụp giờ được thử lại có giới hạn, giãn cách tăng dần kèm
          # nhiễu; hết lượt thì KHÔNG thoát mà để vòng thăm dò kế tiếp đẩy lại.
          push_snapshot() {
            local attempt
            for attempt in 1 2 3; do
              if git push --force origin "$1:refs/heads/live"; then
                return 0
              fi
              sleep $(( attempt * 2 + RANDOM % 3 ))
            done
            return 1
          }

          started="$(date +%s)"
          published_hash=""
          verified="false"
          live_path="$(mktemp "${RUNNER_TEMP}/live-result.XXXXXX.json")"
          export LIVE_PATH="$live_path"
          trap 'rm -f "$live_path"' EXIT
          while true; do
            python src/live_sync.py --out "$live_path" --min-agreement 2

            # Ignore checked_at timestamps when deciding whether the user-visible
            # payload changed, so we do not create needless force-pushes.
            payload_hash="$(python - <<'PY'
          import hashlib, json
          import os
          with open(os.environ['LIVE_PATH'], encoding='utf-8') as fh:
              p=json.load(fh)
          p.pop('checked_at_utc', None); p.pop('checked_at_local', None)
          print(hashlib.sha256(json.dumps(p, sort_keys=True, ensure_ascii=False).encode()).hexdigest())
          PY
          )"

            if [[ "$payload_hash" != "$published_hash" ]]; then
              blob="$(git hash-object -w "$live_path")"
              tree="$(printf '100644 blob %s\tlive.json\n' "$blob" | git mktree)"
              commit="$(printf 'live: XSMB snapshot\n' | git commit-tree "$tree")"
              if push_snapshot "$commit"; then
                published_hash="$payload_hash"
              else
                echo "::warning::Chưa đẩy được ảnh chụp live sau 3 lần thử; vòng thăm dò kế tiếp sẽ đẩy lại."
              fi
            fi

            # Chỉ dừng khi kết quả đã xác minh VÀ chính ảnh chụp ấy đã lên
            # nhánh live — nếu không, người xem kẹt ở ảnh chụp dở dang.
            #
            # Còn `verified` thì theo NGUỒN, không theo lần đẩy: nó kích hoạt
            # hoàn tất dữ liệu ngày, và chuỗi ấy (update-data rồi
            # post-finalization) tự ghi ảnh chụp chuẩn lên nhánh live từ
            # data/xsmb.csv. Nếu đẩy hỏng tới hết giờ, đó chính là đường sửa
            # nhánh live; giữ lại cờ thì nhánh live kẹt tới cron kế tiếp.
            status="$(python -c "import json, os; print(json.load(open(os.environ['LIVE_PATH']))['status'])")"
            if [[ "$status" == "complete_verified" ]]; then
              verified="true"
              if [[ "$published_hash" == "$payload_hash" ]]; then
                echo "Verified complete result reached."
                break
              fi
            else
              verified="false"
            fi

            now="$(date +%s)"
            if (( now - started >= MAX_SECONDS )); then
              echo "Live polling window finished."
              break
            fi
            sleep "$POLL_SECONDS"
          done

          echo "verified=${verified}" >> "$GITHUB_OUTPUT"

      - name: Kích hoạt hoàn tất dữ liệu ngày ngay lập tức
        if: steps.poll.outputs.verified == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import random
          import time
          import urllib.error
          import urllib.request

          repo = os.environ["REPOSITORY"]
          branch = os.environ.get("DEFAULT_BRANCH") or "main"
          api = os.environ.get("GITHUB_API_URL") or "https://api.github.com"
          url = f"{api}/repos/{repo}/actions/workflows/update-data.yml/dispatches"
          payload = json.dumps(
              {"ref": branch, "inputs": {"reason": "live_verified"}}
          ).encode("utf-8")

          # Thử lại CHỈ với lỗi thoáng qua (5xx, mạng). Lỗi 4xx là quyền hoặc
          # cấu hình sai: thử lại chỉ che nó đi, nên dừng ngay và làm đỏ.
          for attempt in range(1, 5):
              req = urllib.request.Request(
                  url,
                  data=payload,
                  method="POST",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      if resp.status != 204:
                          raise RuntimeError(f"workflow dispatch failed: HTTP {resp.status}")
                  break
              except urllib.error.HTTPError as exc:
                  if exc.code < 500 or attempt == 4:
                      raise
                  reason = f"HTTP {exc.code}"
              except (urllib.error.URLError, TimeoutError) as exc:
                  if attempt == 4:
                      raise
                  reason = str(getattr(exc, "reason", exc))[:80]
              delay = 2 ** attempt + random.uniform(0, 1)
              print(f"Lần {attempt} lỗi thoáng qua ({reason}); thử lại sau {delay:.1f}s.")
              time.sleep(delay)
          print("Daily finalization dispatched after verified live result.")
          PY
