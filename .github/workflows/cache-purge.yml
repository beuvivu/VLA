name: Xóa cache Actions (thủ công)

on:
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: actions-cache-purge
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Xóa toàn bộ cache workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh cache list --repo "$GITHUB_REPOSITORY"
          gh cache delete --all --confirm --repo "$GITHUB_REPOSITORY"
