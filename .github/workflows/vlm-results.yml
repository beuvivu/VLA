name: VLM · Tự cập nhật kết quả từng sản phẩm Vietlott

# Chép từ VLM (.github/workflows/results.yml), chạy engine trong `vietlott/`.
# GitHub cron uses UTC: 23:00–15:50 UTC = 06:00–22:50 Vietnam time.
# This is recovery at ten-minute intervals, not a realtime SLA. The API's
# persistent updater polls live windows every two minutes.
#
# Khác bản gốc: KHÔNG triển khai GitHub Pages. Trong kho này `pages.yml` là
# workflow triển khai duy nhất (CLAUDE.md); trang riêng của engine vẫn được dựng
# để kiểm và lưu thành artifact, còn trang Vietlott của site dựng từ dữ liệu này.
on:
  schedule:
    - cron: "*/10 23,0-15 * * *"
    - cron: "17 16-22 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/vlm-results.yml
      - vietlott/src/vlm/updates/**
      - vietlott/src/vlm/forecast/**
      - vietlott/src/vlm/web/**
      - vietlott/scripts/build_site.py
      - vietlott/scripts/persist_site.py
      - vietlott/scripts/site_assets/**

permissions:
  contents: write

concurrency:
  group: vlm-vietlott-update
  cancel-in-progress: false

defaults:
  run:
    working-directory: vietlott

jobs:
  results:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VQE_SOURCE: auto
      VQE_HTTP_BACKEND: httpx
      VQE_SEED_FILE_DIR: data/seed
      VQE_AUTO_UPDATE_DIR: data/results
      VQE_LOG_LEVEL: WARNING
      PYTHONUTF8: "1"
      TZ: Asia/Ho_Chi_Minh
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: vietlott/pyproject.toml
      - name: Cài crawler
        run: python -m pip install -e ".[crawler]"
      - name: Đồng bộ main mới nhất trước khi cập nhật
        run: python scripts/persist_site.py sync

      - name: Khôi phục trạng thái
        uses: actions/cache/restore@v6
        with:
          path: |
            vietlott/data/vietlott.duckdb*
            vietlott/data/parquet
            vietlott/data/products
            vietlott/data/forecast/*.json
            vietlott/data/forecast/ml/*.json.gz
            vietlott/data/results/status.json
          key: vqe-state-${{ github.run_id }}
          restore-keys: vqe-state-
      - name: Cập nhật các sản phẩm đến hạn
        id: update
        continue-on-error: true
        run: vlm-update --once > results-status.json
      - name: Chấm dự báo cũ và lưu bộ số cho kỳ chưa quay
        continue-on-error: true
        run: vietlott forecast next --product all > forecasts.json
      - name: Hoàn tất dự báo ML theo dữ liệu mới
        continue-on-error: true
        run: vlm-forecast next --product all > ml-forecasts.json
      - name: Giữ kết quả đã xác thực trong repo
        id: persist
        if: always()
        run: python scripts/persist_site.py persist

      - name: Dựng trang kết quả, dự báo và đối chiếu
        id: build
        if: always() && steps.persist.outcome == 'success'
        run: python scripts/build_site.py --out site
      - name: Lưu trang đã dựng
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: vlm-results-site-${{ github.run_id }}-${{ github.run_attempt }}
          path: vietlott/site
          retention-days: 7
      - name: Lưu trạng thái
        if: always() && steps.persist.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            vietlott/data/vietlott.duckdb*
            vietlott/data/parquet
            vietlott/data/products
            vietlott/data/forecast/*.json
            vietlott/data/forecast/ml/*.json.gz
            vietlott/data/results/status.json
          key: vqe-state-${{ github.run_id }}
      - name: Báo cáo cập nhật
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: vietlott-results-status
          path: |
            vietlott/results-status.json
            vietlott/data/results/status.json
          retention-days: 14
      - name: Báo lỗi nguồn hoặc worker
        if: steps.update.outcome == 'failure'
        run: |
          echo "::error::Có sản phẩm chưa đồng bộ được; xem status. Kết quả đã lưu được giữ, kỳ còn thiếu sẽ được thử lại."
          exit 1
