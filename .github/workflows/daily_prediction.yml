name: Dự đoán hằng ngày

on:
  schedule:
    - cron: "35 11 * * *"
    - cron: "15 12 * * *"
    - cron: "15 13 * * *"
  workflow_run:
    workflows: ["Hoàn tất XSMB, thống kê và AI/ML"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-xsmb-pipeline
  cancel-in-progress: false

jobs:
  predict:
    name: Sinh dự đoán cho kỳ kế tiếp
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      PYTHONPATH: ${{ github.workspace }}/src
      TZ: Asia/Ho_Chi_Minh
      OMP_NUM_THREADS: "1"

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v7

      - name: Thiết lập Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip

      - name: Cài đặt thư viện phụ thuộc
        run: pip install -r requirements.txt

      - name: Sinh dự đoán
        id: predict
        run: |
          set -euo pipefail
          if python src/forecast/modeling/run_daily_prediction.py; then
            echo "generated=true" >> "$GITHUB_OUTPUT"
          else
            prediction_status=$?
            if (( prediction_status != 3 )); then
              exit "$prediction_status"
            fi
            echo "generated=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Chưa sinh được dự đoán ở lượt này; mốc giờ sau sẽ thử lại."
          fi

      - name: Ghi kết quả vào kho
        if: steps.predict.outputs.generated == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          same_as_head() {
            git cat-file -e HEAD:data/predictions_today.json 2>/dev/null || return 1
            python - <<'PY'
          import json
          import math
          import subprocess
          import sys

          def same(a, b):
              if isinstance(a, float) or isinstance(b, float):
                  return (
                      isinstance(a, (int, float)) and isinstance(b, (int, float))
                      and math.isclose(a, b, rel_tol=1e-9, abs_tol=1e-8)
                  )
              if isinstance(a, dict) and isinstance(b, dict):
                  return a.keys() == b.keys() and all(same(a[k], b[k]) for k in a)
              if isinstance(a, list) and isinstance(b, list):
                  return len(a) == len(b) and all(same(x, y) for x, y in zip(a, b))
              return a == b

          head = subprocess.run(
              ["git", "show", "HEAD:data/predictions_today.json"],
              capture_output=True, text=True, check=True,
          ).stdout
          old = json.loads(head)
          with open("data/predictions_today.json", encoding="utf-8") as fh:
              new = json.load(fh)
          for payload in (old, new):
              payload.pop("generated_at_local", None)
              payload.pop("generated_at_utc", None)
          sys.exit(0 if same(old, new) else 1)
          PY
          }

          for attempt in 1 2 3 4; do
            if (( attempt > 1 )); then
              git rebase --abort 2>/dev/null || true
              git fetch origin "${GITHUB_REF_NAME}"
              git reset --hard "origin/${GITHUB_REF_NAME}"
              if python src/forecast/modeling/run_daily_prediction.py; then
                :
              else
                prediction_status=$?
                if (( prediction_status != 3 )); then
                  exit "$prediction_status"
                fi
                echo "::notice::Trên nền mới nhất không còn dự đoán nào cần ghi."
                exit 0
              fi
            fi

            if same_as_head; then
              echo "Dự đoán không đổi so với bản đã có (chỉ khác dấu thời gian)."
              exit 0
            fi

            TARGET_DATE="$(python -c "import json;print(json.load(open('data/predictions_today.json'))['date'])")"
            git add data/predictions_today.json
            git commit -m "data: dự đoán cho kỳ ${TARGET_DATE}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Đã đẩy ở lần thử ${attempt}."
              exit 0
            fi
            sleep $(( 2 ** attempt + RANDOM % 3 ))
          done
          echo "::error::Không đẩy được sau 4 lần thử."
          exit 1
