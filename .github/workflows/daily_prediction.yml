name: Dự đoán hằng ngày

on:
  schedule:
    # 11:35 UTC = 18:35 Asia/Ho_Chi_Minh (UTC+7), ngay sau giờ quay thưởng 18:30.
    - cron: "35 11 * * *"
    # Kết quả kỳ mới thường vào kho muộn hơn mốc trên. Vài mốc dự phòng để lượt
    # đầu trượt không đẩy dự đoán sang tận hôm sau.
    - cron: "15 12 * * *"
    - cron: "15 13 * * *"
  workflow_run:
    # Chạy ngay khi kết quả kỳ mới vừa vào kho, thay vì chờ mốc giờ kế tiếp.
    workflows: ["Hoàn tất XSMB, thống kê và AI/ML"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# Dùng chung nhóm với pipeline dữ liệu để hai quy trình xếp hàng thay vì cùng
# ghi vào kho một lúc và đá nhau khi push.
concurrency:
  group: daily-xsmb-pipeline
  cancel-in-progress: false

jobs:
  predict:
    name: Sinh dự đoán cho kỳ kế tiếp
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      PYTHONPATH: ${{ github.workspace }}/src
      TZ: Asia/Ho_Chi_Minh
      OMP_NUM_THREADS: "1"

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cài đặt thư viện phụ thuộc
        run: pip install -r requirements.txt

      - name: Sinh dự đoán
        id: predict
        run: |
          set -euo pipefail
          # Mã nguồn tự dừng sạch khi dữ liệu chưa về hoặc kỳ đích đã quay xong.
          # Đó là kết quả hợp lệ của một lượt chạy sớm, không phải sự cố, nên
          # lượt chạy được đánh dấu bỏ qua thay vì làm đỏ workflow.
          if python src/run_daily_prediction.py; then
            echo "generated=true" >> "$GITHUB_OUTPUT"
          else
            echo "generated=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Chưa sinh được dự đoán ở lượt này; mốc giờ sau sẽ thử lại."
          fi

      - name: Ghi kết quả vào kho
        if: steps.predict.outputs.generated == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Dự đoán chỉ khác bản đã có ở dấu thời gian thì KHÔNG ghi. Trước
          # đây mỗi lượt đều ghi một commit như thế (tám commit cho cùng một
          # kỳ trong một đêm), và hai lượt nối nhau đủ để xung đột.
          same_as_head() {
            git cat-file -e HEAD:data/predictions_today.json 2>/dev/null || return 1
            python - <<'PY'
          import json
          import subprocess
          import sys

          head = subprocess.run(
              ["git", "show", "HEAD:data/predictions_today.json"],
              capture_output=True, text=True, check=True,
          ).stdout
          old = json.loads(head)
          with open("data/predictions_today.json", encoding="utf-8") as fh:
              new = json.load(fh)
          for payload in (old, new):
              payload.pop("generated_at_local", None)
              payload.pop("generated_at_utc", None)
          sys.exit(0 if old == new else 1)
          PY
          }

          # Mỗi lần thử bắt đầu lại từ ĐẦU nhánh chính và sinh lại dự đoán
          # trên nền ấy, thay vì `pull --rebase` lên cây cũ. Lượt 36037174777
          # cho thấy vì sao: lượt khác vừa đẩy dự đoán cùng kỳ, rebase xung
          # đột ở data/predictions_today.json và để cây ở GIỮA CHỪNG; ba lần
          # thử sau đều chết ngay vì "unmerged files" — vòng thử lại không tự
          # hồi phục được. Dự đoán là hàm của dữ liệu trên nhánh, nên sinh lại
          # mới đúng; trộn hai tệp thì không.
          for attempt in 1 2 3 4; do
            if (( attempt > 1 )); then
              git rebase --abort 2>/dev/null || true
              git fetch origin "${GITHUB_REF_NAME}"
              git reset --hard "origin/${GITHUB_REF_NAME}"
              if ! python src/run_daily_prediction.py; then
                echo "::notice::Trên nền mới nhất không còn dự đoán nào cần ghi."
                exit 0
              fi
            fi

            if same_as_head; then
              echo "Dự đoán không đổi so với bản đã có (chỉ khác dấu thời gian)."
              exit 0
            fi

            TARGET_DATE="$(python -c "import json;print(json.load(open('data/predictions_today.json'))['date'])")"
            git add data/predictions_today.json
            git commit -m "data: dự đoán cho kỳ ${TARGET_DATE}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Đã đẩy ở lần thử ${attempt}."
              exit 0
            fi
            sleep $(( 2 ** attempt + RANDOM % 3 ))
          done
          echo "::error::Không đẩy được sau 4 lần thử."
          exit 1
