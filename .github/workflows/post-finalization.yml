name: Kiểm toán sau hoàn tất và đối soát trực tiếp

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: post-finalization-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Ho_Chi_Minh
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - name: Lấy nhánh mặc định mới nhất
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Thiết lập Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Cài đặt thư viện phụ thuộc
        # Việc này TỪNG chạy không cần cài gì: cả hai kịch bản khi ấy chỉ dùng
        # thư viện chuẩn. Hai thay đổi sau đó phá vỡ giả định im lặng ấy —
        # `production_audit.py` nhận thêm pandas qua `calendar_alignment`
        # (0f5f890), và `reconcile_live_canonical.py` nhận thêm bs4/requests
        # qua `sources` (đợt đổi chính sách nguồn). Việc này đỏ 130 lượt liên
        # tiếp kể từ 08/09 mà không ai thấy, vì nó chỉ chạy bằng dispatch.
        #
        # Cài thẳng `requirements.txt` chứ không chép một danh sách gọn hơn:
        # một danh sách chép tay thứ ba sẽ lệch đúng như thế lần sau.
        run: |
          python -m pip install --upgrade --no-cache-dir pip wheel setuptools
          python -m pip install --no-cache-dir -r requirements.txt

      - name: Chạy kiểm toán production nghiêm ngặt
        run: |
          audit_path="$(mktemp "${RUNNER_TEMP}/production-audit.XXXXXX.json")"
          python src/evaluation/production_audit.py \
            --cutoff 18:35 \
            --strict \
            --json-out "$audit_path"

      - name: Tạo ảnh chụp trực tiếp chuẩn
        id: live-payload
        run: |
          live_path="$(mktemp "${RUNNER_TEMP}/live-canonical.XXXXXX.json")"
          python src/ingest/reconcile_live_canonical.py --out "$live_path"
          printf 'path=%s\n' "$live_path" >> "$GITHUB_OUTPUT"

      - name: Xuất bản ảnh chụp chuẩn lên nhánh live
        shell: bash
        env:
          LIVE_PATH: ${{ steps.live-payload.outputs.path }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          blob="$(git hash-object -w "$LIVE_PATH")"
          tree="$(printf '100644 blob %s\tlive.json\n' "$blob" | git mktree)"
          commit="$(printf 'live: reconcile canonical result\n' | git commit-tree "$tree")"
          # live-results.yml cũng ghi nhánh live trong khung quay. Lượt 45607100671 (25-11-2026)
          # đỏ vì hai lần đẩy rơi trong cùng một giây: máy chủ so-và-đổi ref theo giá trị nó vừa
          # quảng bá và từ chối «cannot lock ref», kể cả với --force. Đẩy lại thì ảnh chụp CHUẨN
          # đè ảnh chụp trực tiếp, đúng thứ tự mong muốn. Hết lượt thì đỏ: không còn vòng nào sau.
          for attempt in 1 2 3 4; do
            if git push --force origin "$commit:refs/heads/live"; then
              exit 0
            fi
            echo "::warning::Đẩy nhánh live lần $attempt hỏng; thử lại."
            sleep $(( attempt * 3 + RANDOM % 3 ))
          done
          echo "::error::Không đẩy được ảnh chụp chuẩn lên nhánh live sau 4 lần."
          exit 1
