name: Kiểm toán sau hoàn tất và đối soát trực tiếp

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: post-finalization-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Ho_Chi_Minh
    steps:
      - name: Lấy nhánh mặc định mới nhất
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Thiết lập Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Chạy kiểm toán production nghiêm ngặt
        run: |
          audit_path="$(mktemp "${RUNNER_TEMP}/production-audit.XXXXXX.json")"
          python src/production_audit.py \
            --cutoff 18:35 \
            --strict \
            --json-out "$audit_path"

      - name: Tạo ảnh chụp trực tiếp chuẩn
        id: live-payload
        run: |
          live_path="$(mktemp "${RUNNER_TEMP}/live-canonical.XXXXXX.json")"
          python src/reconcile_live_canonical.py --out "$live_path"
          printf 'path=%s\n' "$live_path" >> "$GITHUB_OUTPUT"

      - name: Xuất bản ảnh chụp chuẩn lên nhánh live
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          live_path="${{ steps.live-payload.outputs.path }}"
          blob="$(git hash-object -w "$live_path")"
          tree="$(printf '100644 blob %s\tlive.json\n' "$blob" | git mktree)"
          commit="$(printf 'live: reconcile canonical result\n' | git commit-tree "$tree")"
          git push --force origin "$commit:refs/heads/live"
