name: Hotfix restore UI CSP
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/hotfix_restore_ui_csp.py"
      - "src/web_security.py"
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore working CSP on all docs HTML
        run: python scripts/hotfix_restore_ui_csp.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/*.html src/web_security.py || true
          git diff --staged --quiet || git commit -m "fix(ui): restore unsafe-inline CSP so layout CSS applies"
          git push
