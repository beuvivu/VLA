name: Đo bố cục trang tham chiếu bằng trình duyệt

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Danh sách URL https, cách nhau bằng dấu phẩy"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: inspect-reference-layout
  cancel-in-progress: true

jobs:
  inspect:
    name: Đo thanh bên, thanh trên, thẻ, bảng, nút và thang chữ
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - run: python -m pip install --no-cache-dir playwright==1.55.0

      - run: python -m playwright install --with-deps chromium

      - name: Đo bố cục đã render
        env:
          URLS: ${{ inputs.urls }}
        run: python scripts/reference/inspect_reference_layout.py
