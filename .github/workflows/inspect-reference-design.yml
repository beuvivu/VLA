name: Đọc đặc tính thiết kế trang tham chiếu

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Danh sách URL https, cách nhau bằng dấu phẩy"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: inspect-reference-design
  cancel-in-progress: true

jobs:
  inspect:
    name: In màu, gradient, bóng, phông và hiệu ứng
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - run: python -m pip install --no-cache-dir requests==2.34.2 beautifulsoup4==4.15.0 lxml==6.1.3

      - name: Đọc và in đặc tính thiết kế
        env:
          URLS: ${{ inputs.urls }}
        run: python scripts/reference/inspect_reference_design.py
