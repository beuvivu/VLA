name: Đọc cách soi cầu của trang tham chiếu

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Danh sách URL https, cách nhau bằng dấu phẩy"
        required: true
        type: string
      max_rows:
        description: "Số hàng tối đa in cho mỗi bảng"
        required: false
        default: "30"
        type: string

permissions:
  contents: read

concurrency:
  group: inspect-reference-bridge
  cancel-in-progress: true

jobs:
  inspect:
    name: In vị trí, tham số và ô được tô
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - run: python -m pip install --no-cache-dir requests==2.34.2 beautifulsoup4==4.15.0 lxml==6.1.3

      - name: Đọc và in
        env:
          URLS: ${{ inputs.urls }}
          MAX_ROWS: ${{ inputs.max_rows }}
        run: python scripts/reference/inspect_reference_bridge.py
