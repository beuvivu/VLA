name: Kiểm lỗ hổng thư viện Python

# Dependabot không còn mở PR cập nhật pip từ khi kho dùng Python 3.15 (`.python-version`): bộ cập nhật
# báo `tool_version_not_supported` (hỗ trợ tới 3.14), nên các bản vá bảo mật không còn tự đến. Workflow
# này thay phần cảnh báo ấy: cài ĐÚNG các bản đã ghim như CI và pipeline, rồi đối chiếu MỌI gói đã cài
# (kể cả gói kéo theo) với cơ sở lỗ hổng của PyPI/OSV. Có lỗ hổng thì lượt chạy đỏ, GitHub báo cho chủ
# dự án, và bảng lỗ hổng nằm ở trang tóm tắt của lượt chạy. Nó chỉ đọc, không mở PR hay sửa tệp nào.
on:
  schedule:
    # Thứ Hai 10:17 giờ VN: ngoài khung quay số và ngoài giờ GitHub hay dồn lịch.
    - cron: "17 3 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "requirements*.txt"
      - "vietlott/pyproject.toml"
      - "scripts/ops/audit_install_set.py"
      # Workflow nào thêm hay đổi lệnh `pip install` thì tập gói bị chấm cũng đổi.
      - ".github/workflows/*.yml"

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vla:
    name: Gói của pipeline và bộ kiểm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Cài đúng các bản đã ghim
        # pip được nâng trước: nó cũng bị chấm, và bản đi kèm runner có thể cũ hơn bản đã vá.
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements-dev.txt -r requirements-live.txt
          python -m pip install --no-cache-dir pip-audit==2.10.1
      - name: Cài thêm gói mà workflow cài thẳng trong lệnh cài
        # Gói viết thẳng trong `pip install` của một workflow mà requirements không có — playwright của job
        # Chromium, build của vlm-release.yml — cũng chạy trên runner, nên cũng phải bị chấm: bản ghim nếu
        # workflow ghim, bản mới nhất nếu không (đúng thứ workflow ấy sẽ cài). Đọc từ chính các workflow
        # (scripts/ops/audit_install_set.py) để gói thêm sau này không lọt.
        run: |
          python scripts/ops/audit_install_set.py > audit-extra.txt
          cat audit-extra.txt
          python -m pip install --no-cache-dir -r audit-extra.txt
      - name: Đối chiếu với cơ sở lỗ hổng
        run: |
          status=0
          python -m pip_audit --strict --progress-spinner off --desc on --format markdown --output audit.md || status=$?
          { echo "## Gói của pipeline và bộ kiểm"; cat audit.md; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  vietlott:
    name: Gói của engine Vietlott
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: vietlott
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Cài engine với mọi phần tuỳ chọn mà các workflow vlm-* cài
        # Phần tuỳ chọn đọc từ chính các workflow (job ML của vlm-ci.yml cài `.[dev,ml]`: xgboost, lightgbm),
        # nên phần thêm sau này cũng bị chấm. `.[dev]` trước để có pyyaml cho kịch bản đọc workflow.
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -e ".[dev]"
          extras=$(python ../scripts/ops/audit_install_set.py --engine-extras)
          echo "Phần tuỳ chọn: $extras"
          python -m pip install --no-cache-dir -e ".[$extras]"
          python -m pip install --no-cache-dir pip-audit==2.10.1
      - name: Đối chiếu với cơ sở lỗ hổng
        # Bỏ chính engine (cài -e, không có trên PyPI); mọi gói nó kéo theo vẫn bị chấm.
        run: |
          status=0
          python -m pip_audit --strict --skip-editable --progress-spinner off --desc on --format markdown --output audit.md || status=$?
          { echo "## Gói của engine Vietlott"; cat audit.md; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
