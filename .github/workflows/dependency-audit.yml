name: Kiểm lỗ hổng thư viện Python

# Dependabot không còn mở PR cập nhật pip từ khi kho dùng Python 3.15 (`.python-version`): bộ cập nhật
# báo `tool_version_not_supported` (hỗ trợ tới 3.14), nên các bản vá bảo mật không còn tự đến. Workflow
# này thay phần cảnh báo ấy: cài ĐÚNG các bản đã ghim như CI và pipeline, rồi đối chiếu MỌI gói đã cài
# (kể cả gói kéo theo) với cơ sở lỗ hổng của PyPI/OSV. Có lỗ hổng thì lượt chạy đỏ, GitHub báo cho chủ
# dự án, và bảng lỗ hổng nằm ở trang tóm tắt của lượt chạy. Nó chỉ đọc, không mở PR hay sửa tệp nào.
on:
  schedule:
    # Thứ Hai 10:17 giờ VN: ngoài khung quay số và ngoài giờ GitHub hay dồn lịch.
    - cron: "17 3 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "requirements*.txt"
      - "vietlott/pyproject.toml"
      - ".github/workflows/dependency-audit.yml"

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vla:
    name: Gói của pipeline và bộ kiểm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Cài đúng các bản đã ghim
        # pip được nâng trước: nó cũng bị chấm, và bản đi kèm runner có thể cũ hơn bản đã vá.
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements-dev.txt -r requirements-live.txt
          python -m pip install --no-cache-dir pip-audit==2.10.1
      - name: Cài thêm gói mà workflow ghim thẳng trong lệnh cài
        # Gói `gói==bản` viết thẳng trong `pip install` của một workflow mà requirements không có — như
        # playwright của job Chromium trong ci.yml — cũng chạy trên runner, nên cũng phải bị chấm. Đọc từ
        # chính các workflow để gói thêm sau này không lọt.
        run: |
          python - > inline-pins.txt <<'PY'
          import pathlib
          import re

          pinned = set()
          for name in pathlib.Path(".").glob("requirements*.txt"):
              for line in name.read_text(encoding="utf-8").splitlines():
                  match = re.match(r"\s*([A-Za-z0-9_.-]+)==", line)
                  if match:
                      pinned.add(match.group(1).lower())
          extra = set()
          for path in sorted(pathlib.Path(".github/workflows").glob("*.yml")):
              for line in re.findall(r"pip install([^\n]*)", path.read_text(encoding="utf-8")):
                  for token in re.findall(r"\"[^\"]*\"|'[^']*'|\S+", line):
                      token = token.strip("\"'")
                      match = re.fullmatch(r"([A-Za-z0-9_.-]+)==[^\s,;]+", token)
                      if match and match.group(1).lower() not in pinned:
                          extra.add(token)
          print("\n".join(sorted(extra)))
          PY
          cat inline-pins.txt
          python -m pip install --no-cache-dir -r inline-pins.txt
      - name: Đối chiếu với cơ sở lỗ hổng
        run: |
          status=0
          python -m pip_audit --strict --progress-spinner off --desc on --format markdown --output audit.md || status=$?
          { echo "## Gói của pipeline và bộ kiểm"; cat audit.md; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  vietlott:
    name: Gói của engine Vietlott
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: vietlott
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Cài engine như các workflow vlm-*
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -e ".[dev,crawler]"
          python -m pip install --no-cache-dir pip-audit==2.10.1
      - name: Đối chiếu với cơ sở lỗ hổng
        # Bỏ chính engine (cài -e, không có trên PyPI); mọi gói nó kéo theo vẫn bị chấm.
        run: |
          status=0
          python -m pip_audit --strict --skip-editable --progress-spinner off --desc on --format markdown --output audit.md || status=$?
          { echo "## Gói của engine Vietlott"; cat audit.md; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
