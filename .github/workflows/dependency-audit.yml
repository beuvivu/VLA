name: Kiểm lỗ hổng thư viện Python

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "requirements*.txt"
      - "vietlott/pyproject.toml"
      - "scripts/ops/audit_install_set.py"
      - ".github/workflows/*.yml"

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vla:
    name: Gói của pipeline và bộ kiểm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Cài đúng các bản đã ghim
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements-dev.txt -r requirements-live.txt
          python -m pip install --no-cache-dir pip-audit==2.10.1
      - name: Cài thêm gói mà workflow cài thẳng trong lệnh cài
        run: |
          python scripts/ops/audit_install_set.py > audit-extra.txt
          cat audit-extra.txt
          python -m pip install --no-cache-dir -r audit-extra.txt
      - name: Đối chiếu với cơ sở lỗ hổng
        run: |
          status=0
          python -m pip_audit --strict --progress-spinner off --desc on --format markdown --output audit.md || status=$?
          {
            echo "## Gói của pipeline và bộ kiểm"
            if [ -s audit.md ]; then cat audit.md
            elif [ "$status" -eq 0 ]; then echo "Không có lỗ hổng đã biết."
            else echo "pip-audit dừng với mã $status mà không ghi bảng: xem nhật ký của bước này."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  vietlott:
    name: Gói của engine Vietlott
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: vietlott
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Cài engine với mọi phần tuỳ chọn mà các workflow vlm-* cài
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -e ".[dev]"
          extras=$(python ../scripts/ops/audit_install_set.py --engine-extras)
          echo "Phần tuỳ chọn: $extras"
          python -m pip install --no-cache-dir -e ".[$extras]"
          python -m pip install --no-cache-dir pip-audit==2.10.1
      - name: Đối chiếu với cơ sở lỗ hổng
        run: |
          python -m pip freeze --all --exclude-editable > installed.txt
          status=0
          python -m pip_audit --strict --no-deps -r installed.txt --progress-spinner off --desc on --format markdown --output audit.md || status=$?
          {
            echo "## Gói của engine Vietlott"
            if [ -s audit.md ]; then cat audit.md
            elif [ "$status" -eq 0 ]; then echo "Không có lỗ hổng đã biết."
            else echo "pip-audit dừng với mã $status mà không ghi bảng: xem nhật ký của bước này."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
