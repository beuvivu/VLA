name: Kiểm thử liên tục

on:
  push:
    # Nhánh làm việc phải tự có tín hiệu, không chờ một PR nào mở.
    #
    # Trước đây danh sách chỉ có main/master, nên đẩy lên nhánh claude/** không
    # khớp `push` và chỉ còn trông vào `pull_request`. Đo được: sáu lần đẩy
    # liên tiếp lên một nhánh ĐANG CÓ PR MỞ không sinh lần chạy nào suốt hơn 45
    # phút. Nhánh im lặng không đỏ, chỉ là không có gì chạy — nhìn hệt như đang
    # chờ, nên phải kích hoạt tay từng lần mới biết mã có xanh hay không.
    #
    # Thêm `push` khiến một lần đẩy khớp CẢ HAI sự kiện. `concurrency` không
    # gộp được chúng: github.ref là refs/heads/... với push nhưng
    # refs/pull/N/merge với pull_request, tức hai nhóm khác nhau. Đã quan sát
    # thấy hai lần chạy song song trên đúng một commit. Chặn ở điều kiện job
    # bên dưới, không phải ở đây.
    branches: ["main", "master", "claude/**", "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Một sự kiện PR sau merge có thể dùng ref main. Không để lượt PR đã được
  # route bỏ qua hủy lượt push main trước khi bất kỳ job kiểm thử nào bắt đầu.
  # Lượt chạy tay cũng có nhóm riêng; push mới cùng nhánh vẫn thay lượt cũ.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  route:
    name: Chọn sự kiện cần kiểm thử
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run_checks: ${{ steps.route.outputs.run_checks }}
    steps:
      - name: Đối chiếu nhánh PR với allowlist push (phân biệt hoa thường)
        id: route
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPO_NAME: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          event = os.environ["EVENT_NAME"]
          if event == "pull_request":
              repo = os.environ.get("REPO_NAME", "")
              head_repo = os.environ.get("HEAD_REPO", "")
              head_ref = os.environ.get("HEAD_REF", "")
              if not repo or not head_repo or not head_ref:
                  raise SystemExit("PR thiếu tên kho hoặc tên nhánh; không thể chọn cổng CI")
              # Khớp đúng allowlist on.push.branches, phân biệt hoa/thường.
              push_covered = head_ref in ("main", "master") or head_ref.startswith(
                  ("claude/", "codex/")
              )
              run_checks = head_repo != repo or not push_covered
          elif event in ("push", "workflow_dispatch"):
              run_checks = True
          else:
              raise SystemExit(f"Sự kiện CI chưa hỗ trợ: {event}")

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"run_checks={str(run_checks).lower()}\n")
          PY
  browser:
    needs: route
    if: needs.route.outputs.run_checks == 'true'
    name: Chromium · ${{ matrix.shard.name }}
    # Ghim 24.04: từ 23-10-2026 `ubuntu-latest` là 26.04 và Playwright 1.55 từ chối cài
    # Chromium ở đó ("does not support chromium on ubuntu26.04-x64"), nên job chết ngay
    # bước cài, trước mọi phép kiểm. Bỏ ghim cùng lúc nâng Playwright lên bản hỗ trợ 26.04.
    runs-on: ubuntu-24.04
    # Một job duy nhất từng mất 22 phút (PR #210) tới 29 phút (PR #211, có 10 phút apt chậm) ngày
    # 05-11-2026, trần 40 phút; riêng bước Vietlott UI 12 phút 17 giây. Ba nhóm chạy song song, đo
    # trên lượt PR #210: khung + bảng + cầu ≈ 8,6 phút, mỗi nửa Vietlott (UI_SHARD theo giao diện
    # sáng/tối) ≈ 6–7 phút. Trần giữ ~3 lần thời lượng đo được của nhóm dài nhất.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard:
          - id: khung
            name: khung, bảng thống kê và cầu
          - id: vietlott-1
            name: Vietlott sáng
            ui_shard: "1/2"
          - id: vietlott-2
            name: Vietlott tối
            ui_shard: "2/2"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - run: python -m pip install playwright==1.55.0 pytest==9.2.0
      - run: python -m playwright install --with-deps chromium
      - name: Kiểm menu dài bằng thao tác cuộn trên điện thoại
        if: matrix.shard.id == 'khung'
        env:
          UI_BROWSER_REQUIRED: "1"
        run: python -m pytest tests/web/test_app_shell.py::test_touch_can_reach_every_navigation_link_on_a_phone -q
      - if: matrix.shard.id == 'khung'
        run: python scripts/browser/check_ui_browser.py
      - if: matrix.shard.id == 'khung'
        run: python scripts/browser/check_dashboard_browser.py
      - if: matrix.shard.id == 'khung'
        run: python scripts/browser/check_stat_tables_browser.py
      - if: matrix.shard.id == 'khung'
        run: python scripts/browser/check_bridge_workspace_browser.py
      - if: matrix.shard.id == 'vietlott-1'
        run: python scripts/browser/check_vietlott_navigation_browser.py
      - name: Kiểm giao diện Vietlott (một nửa số trạng thái)
        if: startsWith(matrix.shard.id, 'vietlott-')
        env:
          UI_SHARD: ${{ matrix.shard.ui_shard }}
        run: python scripts/browser/check_vietlott_ui_browser.py
      - name: Lưu ảnh và kết quả kiểm tra giao diện
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-browser-review-${{ matrix.shard.id }}
          path: ui-browser-artifacts/
          retention-days: 7
  browser-gate:
    # Giữ đúng TÊN kiểm cũ của job trình duyệt một khối: nhánh được bảo vệ có thể đang đòi tên ấy.
    # Xanh khi và chỉ khi cả ba nhóm Chromium xanh.
    needs: [route, browser]
    if: always() && needs.route.outputs.run_checks == 'true'
    name: Giao diện Chromium sáng/tối và mobile
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Mọi nhóm Chromium đều xanh
        env:
          RESULT: ${{ needs.browser.result }}
        run: |
          echo "Kết quả các nhóm Chromium: ${RESULT}"
          test "${RESULT}" = "success"
  test:
    needs: route
    if: needs.route.outputs.run_checks == 'true'
    name: Kiểm thử thống kê, AI/ML và quy trình nghiên cứu
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      VN_LOTTERY_ROOT: ${{ github.workspace }}
      PYTHONPATH: ${{ github.workspace }}/src
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v7

      - name: Thiết lập Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Thiết lập Node 22
        # Bốn phép kiểm đối chiếu Python/JS gọi `node` để chạy bản mã của
        # Worker. Runner ubuntu-latest tình cờ có sẵn Node, nhưng trông vào
        # thứ tình cờ thì một ngày nào đó nó biến mất và các phép kiểm ấy tự
        # BỎ QUA — chốt chặn giả còn tệ hơn không có chốt. Ghim tường minh.
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Cài đặt thư viện phụ thuộc
        run: |
          python -m pip install --upgrade --no-cache-dir pip wheel setuptools
          python -m pip install --no-cache-dir -r requirements-dev.txt
          # Trang Vietlott dựng từ engine `vietlott/`, và phép kiểm của trang đọc
          # dữ liệu engine thật — thiếu duckdb, pydantic-settings… của engine là
          # `test_vietlott_results.py` đỏ. Engine là dự án tự đủ, cài như gói.
          python -m pip install --no-cache-dir -e vietlott

      - name: Kiểm thử tương tác điều hướng
        run: |
          npm ci --prefix tests/frontend
          npm test --prefix tests/frontend

      - name: Kiểm tra phát hành lõi
        run: bash scripts/release/release_check.sh

      - name: Kiểm tra cổng ngoài mẫu của challenger miền số
        run: bash scripts/release/domain_challenger_check.sh

      - name: Kiểm tra miền số, cặp số và tính toàn vẹn Excel
        run: bash scripts/release/number_integrity_check.sh

      - name: Kiểm tra phát hành lớp nghiên cứu
        run: bash scripts/release/research_release_check.sh
