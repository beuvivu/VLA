name: Kiểm thử liên tục

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Kiểm thử thống kê, AI/ML và quy trình nghiên cứu
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      VN_LOTTERY_ROOT: ${{ github.workspace }}
      PYTHONPATH: ${{ github.workspace }}/src
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v7

      - name: Thiết lập Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Cài đặt thư viện phụ thuộc
        run: |
          python -m pip install --upgrade --no-cache-dir pip wheel setuptools
          python -m pip install --no-cache-dir -r requirements-dev.txt

      - name: Kiểm tra phát hành lõi
        run: bash scripts/release_check.sh

      - name: Kiểm tra cổng ngoài mẫu của challenger miền số
        run: bash scripts/domain_challenger_check.sh

      - name: Kiểm tra miền số, cặp số và tính toàn vẹn Excel
        run: bash scripts/number_integrity_check.sh

      - name: Kiểm tra phát hành lớp nghiên cứu
        run: bash scripts/research_release_check.sh
