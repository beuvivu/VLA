name: Giám sát và tự phục hồi production

on:
  workflow_dispatch:
  schedule:
    # UTC only; Vietnam is UTC+7.
    # Live heartbeat recovery: 17:55 / 18:05 / 18:15 / 18:25 / 18:45 VN.
    - cron: "55 10 * * *"
    - cron: "5 11 * * *"
    - cron: "15 11 * * *"
    - cron: "25 11 * * *"
    - cron: "45 11 * * *"
    # Canonical/data recovery: 19:05 / 19:25 / 19:45 / 20:05 VN.
    - cron: "5 12 * * *"
    - cron: "25 12 * * *"
    - cron: "45 12 * * *"
    - cron: "5 13 * * *"
    # Overnight safety net: 07:15 VN next morning.
    - cron: "15 0 * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: production-watchdog
  cancel-in-progress: false

jobs:
  audit-and-recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Lấy mã nguồn main mới nhất
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Thiết lập Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Kiểm toán production và kích hoạt phục hồi khi cần
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TZ: Asia/Ho_Chi_Minh
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import csv
          import json
          import os
          import subprocess
          import sys
          import tempfile
          import urllib.request
          from datetime import datetime, time, timedelta
          from zoneinfo import ZoneInfo

          repo = os.environ["REPOSITORY"]
          branch = os.environ.get("DEFAULT_BRANCH") or "main"
          token = os.environ["GH_TOKEN"]
          tz = ZoneInfo("Asia/Ho_Chi_Minh")
          now = datetime.now(tz)

          def api_request(url, *, method="GET", payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  url,
                  data=data,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(req, timeout=20) as resp:
                  return resp.status, resp.read()

          def workflow_active(workflow):
              url = f"https://api.github.com/repos/{repo}/actions/workflows/{workflow}/runs?per_page=10"
              try:
                  status, raw = api_request(url)
                  if status != 200:
                      return False
                  runs = json.loads(raw.decode("utf-8")).get("workflow_runs", [])
                  active = {"queued", "in_progress", "pending", "waiting", "requested"}
                  return any(str(run.get("status")) in active for run in runs)
              except Exception as exc:
                  print(f"[WARN] cannot inspect workflow {workflow}: {exc}")
                  return False

          def dispatch(workflow, inputs=None):
              if workflow_active(workflow):
                  print(f"[SKIP] {workflow} already active")
                  return
              url = f"https://api.github.com/repos/{repo}/actions/workflows/{workflow}/dispatches"
              payload = {"ref": branch}
              if inputs:
                  payload["inputs"] = inputs
              status, _ = api_request(url, method="POST", payload=payload)
              if status != 204:
                  raise RuntimeError(f"dispatch {workflow} failed: HTTP {status}")
              print(f"[RECOVERY] dispatched {workflow}")

          def fetch_live():
              url = f"https://api.github.com/repos/{repo}/contents/live.json?ref=live"
              try:
                  status, raw = api_request(url)
                  if status != 200:
                      return None
                  obj = json.loads(raw.decode("utf-8"))
                  return json.loads(base64.b64decode(obj["content"]).decode("utf-8"))
              except Exception as exc:
                  print(f"[WARN] live branch unavailable: {exc}")
                  return None

          local_hm = now.hour * 60 + now.minute
          live_window = 17 * 60 + 55 <= local_hm <= 18 * 60 + 55
          pages_window = 20 * 60 + 10 <= local_hm <= 20 * 60 + 35

          if live_window:
              live = fetch_live()
              healthy = False
              if live and str(live.get("draw_date")) == now.date().isoformat():
                  try:
                      checked = datetime.fromisoformat(str(live.get("checked_at_local")))
                      age = (now - checked.astimezone(tz)).total_seconds()
                      healthy = -60 <= age <= 300
                      print(f"[INFO] live status={live.get('status')} age_s={age:.0f}")
                  except Exception as exc:
                      print(f"[WARN] live timestamp invalid: {exc}")
              if not healthy:
                  dispatch("live-results.yml")
              else:
                  print("[OK] live heartbeat is current")
              raise SystemExit(0)

          expected = now.date() if now.time().replace(tzinfo=None) >= time(18, 35) else now.date() - timedelta(days=1)
          latest = None
          try:
              with open("data/xsmb.csv", newline="", encoding="utf-8") as fh:
                  latest = max(str(r["date"])[:10] for r in csv.DictReader(fh) if r.get("date"))
          except Exception as exc:
              print(f"[WARN] cannot read canonical CSV: {exc}")

          print(f"[INFO] canonical latest={latest} expected={expected}")
          if latest != expected.isoformat():
              dispatch("update-data.yml", {"reason": "watchdog_recovery"})
              raise SystemExit(0)

          with tempfile.TemporaryDirectory(prefix="vla-production-audit-") as temp_dir:
              audit = subprocess.run(
                  [
                      sys.executable,
                      "src/production_audit.py",
                      "--cutoff",
                      "18:35",
                      "--strict",
                      "--json-out",
                      os.path.join(temp_dir, "audit.json"),
                  ],
                  text=True,
                  capture_output=True,
              )
          print(audit.stdout)
          if audit.returncode != 0:
              print(audit.stderr)
              dispatch("update-data.yml", {"reason": "watchdog_recovery"})
              raise SystemExit(0)

          live = fetch_live()
          live_reconciled = bool(
              live
              and str(live.get("draw_date")) == latest
              and str(live.get("status")) == "complete_verified"
              and bool(live.get("verified_complete"))
              and bool(live.get("canonical_reconciled"))
          )
          if not live_reconciled:
              dispatch("post-finalization.yml")
          else:
              print("[OK] live branch is reconciled to canonical")

          if pages_window:
              dispatch("pages.yml")
          else:
              print("[OK] production audit passed")
          PY
