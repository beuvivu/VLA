name: Chẩn đoán nguồn live

on:
  workflow_dispatch:
    inputs:
      draw_date:
        description: "Ngày quay YYYY-MM-DD (để trống là hôm nay VÀ hôm qua giờ VN)"
        required: false
        default: ""
        type: string
      crosscheck_start:
        description: "Đối chiếu sổ chuẩn từ ngày YYYY-MM-DD (để trống là chẩn đoán nguồn live)"
        required: false
        default: ""
        type: string
      crosscheck_end:
        description: "Đối chiếu tới ngày YYYY-MM-DD"
        required: false
        default: ""
        type: string
      crosscheck_sources:
        description: "Nơi ghi để đối chiếu, cách nhau bằng dấu cách (minhngoc, mketqua)"
        required: false
        default: "minhngoc"
        type: string

permissions:
  contents: read

concurrency:
  group: diagnose-live-sources
  cancel-in-progress: true

jobs:
  diagnose:
    name: Bóc thử trên trang nguồn thật
    if: inputs.crosscheck_start == ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      TZ: Asia/Ho_Chi_Minh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - run: python -m pip install --no-cache-dir -r requirements-live.txt

      - name: Bóc thử từng nguồn
        env:
          DRAW_DATE: ${{ inputs.draw_date }}
        run: |
          if [[ -n "${DRAW_DATE:-}" ]]; then
            dates=(--date "$DRAW_DATE")
          else
            dates=(--date "$(date +%F)" --date "$(date -d yesterday +%F)")
          fi
          python scripts/ops/diagnose_live_sources.py "${dates[@]}" --out-dir "$RUNNER_TEMP/pages"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: live-source-pages
          path: ${{ runner.temp }}/pages
          retention-days: 1
          if-no-files-found: ignore

  crosscheck:
    name: Đối chiếu sổ chuẩn với nơi ghi khác
    if: inputs.crosscheck_start != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - run: python -m pip install --no-cache-dir -r requirements-live.txt

      - name: So từng ô
        env:
          START: ${{ inputs.crosscheck_start }}
          END: ${{ inputs.crosscheck_end }}
          SOURCES: ${{ inputs.crosscheck_sources }}
        run: |
          args=()
          for source in $SOURCES; do args+=(--source "$source"); done
          python scripts/ops/crosscheck_canonical_history.py --start "$START" --end "${END:-$START}" "${args[@]}"
