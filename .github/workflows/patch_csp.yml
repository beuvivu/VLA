name: Patch CSP no-inline
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/patch_csp_no_inline.py"
      - "src/web_security.py"
      - "docs/assets/css-async.js"
      - "docs/assets/ui-dock.js"
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply CSP no-inline rewrite on docs HTML
        run: python scripts/patch_csp_no_inline.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/*.html || true
          git diff --staged --quiet || git commit -m "security(csp): strip unsafe-inline via hashes + external loaders"
          git push
