name: Đọc cấu trúc trang tham chiếu

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Danh sách URL, cách nhau bằng dấu phẩy"
        required: false
        default: >-
          https://hainhay.net/tan-suat-loto,https://hainhay.net/tan-suat-cap-loto,https://hainhay.net/bang-dac-biet,https://hainhay.net/bang-dac-biet-thang,https://hainhay.net/bang-dac-biet-nam,https://hainhay.net/cau-giai-dac-biet
        type: string
      dump_links:
        description: "In danh sách liên kết cho MỌI trang (1) hay chỉ trang đầu"
        required: false
        default: "0"
        type: string
      html_selector:
        description: "Bộ chọn CSS: in nguyên HTML của các phần tử khớp (để trống thì bỏ qua)"
        required: false
        default: ""
        type: string
      html_count:
        description: "Số phần tử tối đa in HTML cho mỗi trang"
        required: false
        default: "2"
        type: string

permissions:
  contents: read

concurrency:
  group: inspect-reference-pages
  cancel-in-progress: true

jobs:
  inspect:
    name: In cấu trúc bảng và điều khiển
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - run: python -m pip install --no-cache-dir requests==2.34.2 beautifulsoup4==4.15.0 lxml==6.1.3

      - name: Đọc và tóm tắt
        env:
          URLS: ${{ inputs.urls }}
          DUMP_LINKS: ${{ inputs.dump_links }}
          HTML_SELECTOR: ${{ inputs.html_selector }}
          HTML_COUNT: ${{ inputs.html_count }}
        run: python scripts/reference/inspect_reference_pages.py
