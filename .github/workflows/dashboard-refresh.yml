name: Làm mới bảng điều khiển Markdown

on:
  push:
    branches: ["main"]
    paths:
      - "src/build_markdown_dashboard_v3.py"
      - ".github/workflows/dashboard-refresh.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: markdown-dashboard-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Lấy mã nguồn main mới nhất
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Thiết lập Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Cài đặt thư viện cho bảng điều khiển
        run: python -m pip install --no-cache-dir pandas==2.2.3 numpy==2.2.6

      - name: Ghi nhận bảng điều khiển đã làm mới
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4; do
            if (( attempt > 1 )); then
              # Bảng phụ thuộc dữ liệu: dựng lại trên main mới, không rebase
              # bảng cũ lên kết quả vừa được workflow khác công bố.
              git fetch origin main
              git reset --hard origin/main
            fi
            python src/build_markdown_dashboard_v3.py
            python - <<'PY'
          from pathlib import Path

          p = Path("DASHBOARD.md")
          text = p.read_text(encoding="utf-8")
          required = [
              "Màu | Khoảng giá trị | Ý nghĩa",
              "lịch 7 cột",
              "Độ nâng so với nền",
              "Kiểm toán và liên kết chi tiết",
          ]
          for marker in required:
              assert marker in text, marker
          assert text.count("Đầu\\Đuôi") >= 12
          assert text.count("| Ý nghĩa | Thanh so sánh |") >= 20
          assert "| month_key | 01 | 02 | 03 | 04 | 05 |" not in text
          assert len(text) > 70_000
          print(f"OK DASHBOARD.md {len(text):,} chars")
          PY
            if git diff --quiet -- DASHBOARD.md; then
              echo "DASHBOARD.md already current"
              exit 0
            fi
            git add DASHBOARD.md
            git commit -m "chore: refresh balanced markdown dashboard"
            if git push origin HEAD:main; then
              exit 0
            fi
            if (( attempt < 4 )); then
              sleep $(( 2 ** attempt + RANDOM % 3 ))
            fi
          done
          echo "::error::Không đẩy được bảng điều khiển sau 4 lần thử."
          exit 1
