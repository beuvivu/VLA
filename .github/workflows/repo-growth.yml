name: Theo dõi dung lượng kho

on:
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-growth
  cancel-in-progress: true

jobs:
  measure:
    name: Đo tốc độ tăng của kho
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Đo gói mỏng 7 ngày, đỏ khi quá 40 MB/tuần
        run: python scripts/ops/repo_growth.py --days 7 --limit-mb 40
