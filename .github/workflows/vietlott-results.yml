name: Trang Vietlott (dựng từ engine)

on:
  workflow_run:
    workflows:
      - "VLM · Tự cập nhật kết quả từng sản phẩm Vietlott"
      - "VLM · Cập nhật dữ liệu, dự báo và trang Vietlott"
    types: [completed]
    branches: [main]
  schedule:
    - cron: "25 6 * * *"
    - cron: "40 11 * * *"
    - cron: "30 12 * * *"
    - cron: "25 14 * * *"
    - cron: "20 15 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/pages/build_vietlott_results.py"
      - "src/web/templates/vietlott_main.css"
      - "src/web/assets/vietlott-picks.js"
      - "src/web/assets/vietlott-comparison.js"
      - "src/pages/vietlott_navigation_content.py"
      - "src/web/evidence_catalog.py"
      - "scripts/ops/push_generated_site.py"
      - "vietlott/src/vlm/web/**"
      - "vietlott/data/results/results.jsonl"
      - "vietlott/data/forecast/*ledger.jsonl"
      - "vietlott/data/forecast/multi-agent-summary.json"
      - ".github/workflows/vietlott-results.yml"

permissions:
  contents: read

concurrency:
  group: vietlott-results-pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      ((github.event.workflow_run.conclusion == 'success' ||
        github.event.workflow_run.conclusion == 'failure') &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      published: ${{ steps.publish.outputs.published }}
    env:
      TZ: Asia/Ho_Chi_Minh
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ github.event_name == 'workflow_run' && github.event.repository.default_branch || github.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Cài thư viện của trang và của engine
        run: |
          python -m pip install --no-cache-dir -r requirements.txt
          python -m pip install --no-cache-dir -e vietlott

      - name: Khôi phục trạng thái của engine
        uses: actions/cache/restore@v6
        with:
          path: |
            vietlott/data/vietlott.duckdb*
            vietlott/data/parquet
            vietlott/data/products
            vietlott/data/forecast/*.json
            vietlott/data/forecast/ml/*.json.gz
            vietlott/data/results/status.json
          key: vqe-state-${{ github.run_id }}
          restore-keys: vqe-state-

      - name: Giữ bản tóm tắt mô hình đã commit
        run: git restore --source=HEAD -- ':(glob)vietlott/data/forecast/*.json'

      - name: Dựng trang Vietlott
        run: python src/pages/build_vietlott_results.py --cache-states vietlott/data/forecast

      - name: Ghi trang
        if: github.ref_name == github.event.repository.default_branch
        run: |
          set -euo pipefail
          python3 src/web/site_assets.py --refresh docs --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/*.html docs/assets
          if git diff --cached --quiet; then
            echo "Trang không đổi."
          elif python3 scripts/web/stamp_only_change.py; then
            git reset -q -- docs
            git checkout -q -- docs
            echo "Chỉ đổi dấu giờ dựng; giữ bản đã commit."
          else
            git commit -m "docs: dựng lại trang Vietlott từ engine"
            python3 scripts/ops/push_generated_site.py --branch "${GITHUB_REF_NAME}"
          fi

      - name: Lấy docs/ của nhánh mặc định mới nhất
        if: github.ref_name == github.event.repository.default_branch
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${GITHUB_REF_NAME}"
          git restore --source=FETCH_HEAD --staged --worktree -- docs

      - name: Nhường lần triển khai khi XSMB đang chốt kỳ
        id: window
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CANONICAL_AT="$(gh api "repos/${GITHUB_REPOSITORY}/commits?sha=${GITHUB_REF_NAME}&path=data/xsmb.csv&per_page=1" \
            --jq '.[0].commit.committer.date' 2>/dev/null || true)"
          python3 scripts/ops/pages_deploy_window.py --ref FETCH_HEAD --canonical-at "${CANONICAL_AT}"

      - name: Chốt phiên bản và kiểm tra tài nguyên
        if: github.ref_name == github.event.repository.default_branch && steps.window.outputs.deploy == 'true'
        run: python3 src/web/site_assets.py --refresh docs --check

      - name: Đóng gói GitHub Pages
        if: github.ref_name == github.event.repository.default_branch && steps.window.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          name: vietlott-pages-${{ github.run_attempt }}
          path: docs

      - name: Đánh dấu đã đóng gói
        id: publish
        if: github.ref_name == github.event.repository.default_branch && steps.window.outputs.deploy == 'true'
        run: echo "published=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build
    if: needs.build.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Triển khai GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: vietlott-pages-${{ github.run_attempt }}
