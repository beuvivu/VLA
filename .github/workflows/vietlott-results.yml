name: Đồng bộ kết quả Vietlott

on:
  push:
    branches: [main]
    paths:
      - 'src/vietlott_results.py'
      - 'src/build_vietlott_results.py'
      - '.github/workflows/vietlott-results.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: "update = kỳ mới; backfill = lùi tiếp lịch sử"
        required: false
        default: "backfill"
        type: choice
        options: [update, backfill]
      limit:
        description: "Số kỳ tối đa mỗi sản phẩm trong lượt này"
        required: false
        default: "1200"
        type: string
  schedule:
    # Sau cửa sổ ưu tiên XSMB và đồng bộ vùng.
    - cron: "45 13 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: vietlott-results-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Môi trường github-pages chỉ cho nhánh mặc định triển khai; khai nó ở job
    # này thì lượt chạy thử trên nhánh khác bị chặn trước cả bước đầu tiên.
    # Triển khai tách sang job `deploy` bên dưới.
    outputs:
      published: ${{ steps.publish.outputs.published }}
    env:
      TZ: Asia/Ho_Chi_Minh
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Cài thư viện
        run: python -m pip install --no-cache-dir -r requirements.txt

      - name: Đồng bộ kỳ mới
        run: python src/vietlott_results.py --mode update --limit 80 --delay 0.25

      - name: Bổ sung lịch sử
        env:
          INPUT_MODE: ${{ github.event.inputs.mode || 'backfill' }}
          INPUT_LIMIT: ${{ github.event.inputs.limit || '1200' }}
        run: |
          if [ "$INPUT_MODE" = "backfill" ]; then
            python src/vietlott_results.py --mode backfill --limit "$INPUT_LIMIT" --delay 0.25
          fi

      - name: Dựng dashboard Vietlott
        run: |
          python src/build_vietlott_results.py
          python - <<'PY'
          from pathlib import Path
          from app_shell import wrap_page
          for path in Path("docs").glob("*.html"):
              path.write_text(wrap_page(path.read_text(encoding="utf-8"), path.name), encoding="utf-8")
          PY

      - name: Kiểm tra database
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          db=sqlite3.connect(Path("data/vietlott/vietlott.sqlite3"))
          from vietlott_results import available_products
          products={r[0]:r[1] for r in db.execute("select product,count(*) from draws group by product")}
          # Keno và Bingo18 không có ở nguồn đang dùng: chỉ đòi các sản phẩm có nguồn.
          required=set(available_products())
          missing=required-set(products)
          if missing: raise SystemExit(f"Thiếu dữ liệu: {sorted(missing)}")
          dup=db.execute("select count(*) from (select product,draw_id,count(*) c from draws group by product,draw_id having c>1)").fetchone()[0]
          assert dup==0
          print(products)
          PY

      - name: Ghi database và HTML
        # Chỉ nhánh mặc định ghi dữ liệu; lượt chạy trên nhánh khác là chạy thử.
        if: github.ref_name == github.event.repository.default_branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/vietlott docs/*.html
          if ! git diff --cached --quiet; then
            git commit -m "data: sync Vietlott results"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Đóng gói GitHub Pages
        if: github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v5
        with:
          name: vietlott-pages-${{ github.run_attempt }}
          path: docs

      - name: Đánh dấu đã đóng gói
        id: publish
        if: github.ref_name == github.event.repository.default_branch
        run: echo "published=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: sync
    if: needs.sync.outputs.published == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Triển khai GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: vietlott-pages-${{ github.run_attempt }}
