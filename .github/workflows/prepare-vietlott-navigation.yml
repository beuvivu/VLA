name: Dựng bản menu Vietlott để rà soát
on:
  push:
    branches: [fix/vietlott-shared-navigation]
    paths: [.github/workflows/prepare-vietlott-navigation.yml]
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Ho_Chi_Minh
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/vietlott-shared-navigation
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt -e vietlott
      - run: python src/build_vietlott_results.py
      - run: python scripts/refresh_navigation.py
      - name: Ghi bản HTML vào nhánh rà soát
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs src/critical_css_generated.py
          if ! git diff --cached --quiet; then
            git commit -m "build: đồng bộ menu Vietlott trên mọi trang"
            git push origin HEAD:fix/vietlott-shared-navigation
          fi
