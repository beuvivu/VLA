name: Đồng bộ XSMT và XSMN

on:
  push:
    branches: [main]
    paths:
      - 'src/ingest/regional_lottery.py'
      - 'src/pages/build_regional_results.py'
      - 'scripts/ops/push_generated_site.py'
      - '.github/workflows/regional-results.yml'
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Số ngày lùi để bổ sung lịch sử (không tải lại ngày đã có)"
        required: false
        default: "365"
        type: string
  schedule:
    # Chạy sau toàn bộ cửa sổ ưu tiên XSMB. GitHub cron là best-effort.
    # 13:25 UTC = 20:25 Asia/Ho_Chi_Minh.
    - cron: "25 13 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: regional-lottery-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TZ: Asia/Ho_Chi_Minh
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Cài thư viện tối thiểu
        run: |
          python -m pip install --no-cache-dir -r requirements.txt

      - name: Đồng bộ Miền Trung và Miền Nam
        id: collect
        continue-on-error: true
        env:
          MANUAL_DAYS: ${{ github.event.inputs.backfill_days || '30' }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then MANUAL_DAYS=365; fi
          if [ "${{ github.event_name }}" = "push" ]; then MANUAL_DAYS=30; fi
          python src/ingest/regional_lottery.py --region both --backfill-days "$MANUAL_DAYS" --delay 0.15 --require-latest

      - name: Dựng trang từ kết quả đã thu thập
        run: |
          python src/pages/build_regional_results.py
          python scripts/web/refresh_navigation.py

      - name: Kiểm tra dữ liệu trước khi ghi
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          for region in ("xsmt", "xsmn"):
              path = Path("data/regions") / f"{region}.csv"
              if not path.exists():
                  raise SystemExit(f"thiếu {path}")
              with path.open(encoding="utf-8") as fh:
                  rows = list(csv.DictReader(fh))
              keys = {(r["date"], r["province"], r["prize"], r["position"]) for r in rows}
              assert len(keys) == len(rows), f"{region}: trùng khóa"
              assert all(r["source"] == "xskt.com.vn" for r in rows), region
              print(region, len(rows), "dòng")
          PY

      - name: Ghi dữ liệu và trang nếu thay đổi
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/regions/xsmt.csv data/regions/xsmt.json data/regions/xsmn.csv data/regions/xsmn.json \
                  docs/*.html docs/assets
          if git diff --cached --quiet; then
            echo "Không có dữ liệu vùng mới."
            exit 0
          fi
          git commit -m "data: sync XSMT/XSMN from xskt.com.vn"
          python3 scripts/ops/push_generated_site.py --branch main

      - name: Chốt phiên bản và kiểm tra tài nguyên
        run: python3 src/web/site_assets.py --refresh docs --check

      - name: Đóng gói GitHub Pages đã cập nhật
        uses: actions/upload-pages-artifact@v5
        with:
          name: regional-pages-${{ github.run_attempt }}
          path: docs

      - name: Triển khai trang Miền Trung/Miền Nam
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: regional-pages-${{ github.run_attempt }}

      - name: Báo lỗi nếu chưa thu thập đủ ngày bắt buộc
        if: ${{ always() && steps.collect.outcome == 'failure' }}
        run: |
          echo "::error::Đồng bộ vùng chưa hoàn tất; xem bước thu thập để biết miền và ngày còn thiếu."
          exit 1
