name: Finalize XSMB + Statistics + AI/ML

on:
  # Bootstrap a freshly published repository and re-run the production pipeline
  # whenever core code/config/data is intentionally changed on the default branch.
  push:
    branches: ["main", "master"]
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "data/xsmb.csv"
      - "requirements*.txt"
      - "pyproject.toml"
      - ".github/workflows/update-data.yml"
  workflow_dispatch:
  schedule:
    # IMPORTANT: keep schedules in UTC. Vietnam is UTC+7.
    # Multiple independent start windows reduce the chance that a delayed/dropped
    # GitHub scheduled event leaves the canonical daily result stale.
    # Local VN times: 18:18, 18:28, 18:38, 18:48, 18:58, 19:13, 19:28.
    - cron: "18 11 * * *"
    - cron: "28 11 * * *"
    - cron: "38 11 * * *"
    - cron: "48 11 * * *"
    - cron: "58 11 * * *"
    - cron: "13 12 * * *"
    - cron: "28 12 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-xsmb-pipeline
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      generated_changed: ${{ steps.commit.outputs.generated_changed }}
      canonical_changed: ${{ steps.canonical_commit.outputs.canonical_changed }}

    env:
      VN_LOTTERY_ROOT: ${{ github.workspace }}
      PYTHONPATH: ${{ github.workspace }}/src
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward to latest default branch
        run: git pull --ff-only origin "${GITHUB_REF_NAME}"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Decide whether finalization is needed
        id: guard
        env:
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import csv
          import os
          from datetime import datetime, time, timedelta
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("Asia/Ho_Chi_Minh"))
          # From 18:15 onward we actively look for today's result. The parser only
          # accepts a complete draw, and recent draws still require 2 independent
          # source groups to agree before canonical promotion.
          target = now.date() if now.time() >= time(18, 15) else now.date() - timedelta(days=1)
          latest = ""
          try:
              with open("data/xsmb.csv", newline="", encoding="utf-8") as f:
                  latest = max(row["date"][:10] for row in csv.DictReader(f) if row.get("date"))
          except Exception:
              pass

          event_name = os.environ.get("EVENT_NAME", "")
          forced = event_name in {"workflow_dispatch", "push"}
          should_run = forced or latest != target.isoformat()
          print(f"run={'true' if should_run else 'false'}")
          print(f"latest={latest}")
          print(f"target={target.isoformat()}")
          print(f"reason={'forced-' + event_name if forced else 'scheduled-staleness'}")
          PY

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -r requirements.txt

      - name: Wait for verified canonical draw
        id: canonical
        if: steps.guard.outputs.run == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import json
          import os
          import subprocess
          import sys
          import time
          from datetime import datetime, time as dtime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          tz = ZoneInfo("Asia/Ho_Chi_Minh")
          output = Path(os.environ["GITHUB_OUTPUT"])
          event_name = os.environ.get("EVENT_NAME", "")
          deadline = time.monotonic() + 15 * 60

          def expected_target():
              now = datetime.now(tz)
              return now.date() if now.time() >= dtime(18, 15) else now.date() - timedelta(days=1)

          def latest_date():
              try:
                  with open("data/xsmb.csv", newline="", encoding="utf-8") as f:
                      values = [row["date"][:10] for row in csv.DictReader(f) if row.get("date")]
                  return max(values) if values else ""
              except Exception:
                  return ""

          def audit_ok(target):
              try:
                  audit = json.loads(Path("data/source_audit.json").read_text(encoding="utf-8"))
                  row = audit.get(target.isoformat(), {})
                  return bool(row.get("accepted")) and int(row.get("agreement", 0)) >= 2
              except Exception:
                  return False

          while True:
              target = expected_target()
              latest = latest_date()

              # For code/manual rebuilds, an already-present canonical date can be
              # reused even if an old repository did not yet persist source_audit.
              # Scheduled ingestion remains strict and requires 2-source consensus.
              if latest == target.isoformat() and (audit_ok(target) or event_name in {"push", "workflow_dispatch"}):
                  with output.open("a", encoding="utf-8") as f:
                      f.write("ready=true\n")
                      f.write(f"target={target.isoformat()}\n")
                  print(f"Canonical draw ready: {target} (latest={latest})")
                  break

              subprocess.run(
                  [
                      sys.executable,
                      "src/sync.py",
                      "--cutoff", "18:15",
                      "--fill-missing-days-back", "14",
                      "--max-retries", "1",
                      "--retry-backoff-s", "1.5",
                      "--consensus-min-recent", "2",
                      "--consensus-recent-days", "2",
                  ],
                  check=True,
              )

              latest = latest_date()
              if latest == target.isoformat() and audit_ok(target):
                  with output.open("a", encoding="utf-8") as f:
                      f.write("ready=true\n")
                      f.write(f"target={target.isoformat()}\n")
                  print(f"Verified canonical draw accepted: {target}")
                  break

              if time.monotonic() >= deadline:
                  with output.open("a", encoding="utf-8") as f:
                      f.write("ready=false\n")
                      f.write(f"target={target.isoformat()}\n")
                  print(f"No verified complete result yet for {target}; a later recovery schedule will retry.")
                  break

              print(f"Result not complete/verified yet for {target}; retrying in 25s...")
              time.sleep(25)
          PY

      - name: Commit canonical result immediately
        id: canonical_commit
        if: steps.canonical.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Commit the authoritative result before any expensive analytics/ML.
          # This guarantees that an analytics failure cannot hold back daily data.
          git add data/xsmb* data/source_audit.json
          if git diff --cached --quiet; then
            echo "Canonical result already committed."
            echo "canonical_changed=false" >> "$GITHUB_OUTPUT"
          else
            TARGET_DATE="${{ steps.canonical.outputs.target }}"
            git commit -m "data: finalize XSMB ${TARGET_DATE}"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "canonical_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run strict end-to-end finalization
        if: steps.canonical.outputs.ready == 'true'
        run: |
          python src/pipeline.py \
            --cutoff 18:15 \
            --window-days 2000 \
            --display-days 10 \
            --lag-max 30 \
            --fill-missing-days-back 365 \
            --strict

      - name: Verify latest expected canonical draw and continuity
        if: steps.canonical.outputs.ready == 'true'
        run: |
          python src/monitor_health.py \
            --health data/health.json \
            --cutoff 18:15 \
            --cutoff-aware \
            --max-staleness-days 0 \
            --fail-on-stale \
            --fail-on-missing

      - name: Verify generated outputs
        if: steps.canonical.outputs.ready == 'true'
        run: |
          test -s data/xsmb.csv
          test -s data/xsmb.json
          test -s data/source_audit.json
          test -s data/history/pred_loto.csv
          test -s data/history/pred_de.csv
          test -s data/significance/global_diagnostics.json
          test -s data/statistical_signal/predict_next_loto_stat_all.csv
          test -s data/statistical_signal/predict_next_de_stat_all.csv
          test -s models/ml_loto.joblib
          test -s models/ml_de.joblib
          test -s models/cau_keo_loto.joblib
          test -s models/cau_keo_de.joblib
          test -s docs/index.html
          test -s docs/statistics.html
          test -s docs/dashboard.html
          test -s docs/model-quality.html
          test -s docs/live.html

      - name: Commit finalized analytics and dashboards
        id: commit
        if: steps.canonical.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data models images docs README.md
          if git diff --cached --quiet; then
            echo "No generated analytics changes to commit."
            echo "generated_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DATA_DATE="$(python -c 'import pandas as pd; df=pd.read_csv("data/xsmb.csv", usecols=["date"]); print(pd.to_datetime(df["date"]).max().date().isoformat())')"
          git commit -m "chore: finalize analytics ${DATA_DATE}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "generated_changed=true" >> "$GITHUB_OUTPUT"

  # Pages is deliberately isolated from the data/ML job. A repository can be
  # private or Pages may not yet be enabled during first installation; that must
  # never prevent canonical data/models from updating successfully.
  deploy-pages:
    name: Deploy refreshed dashboards (optional)
    needs: update
    if: ${{ github.event.repository.private == false && needs.update.result == 'success' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest generated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
