name: Hoàn tất XSMB, thống kê và AI/ML

on:
  # Bootstrap a freshly published repository and re-run the production pipeline
  # whenever core code/config/data is intentionally changed on the default branch.
  push:
    branches: ["main", "master"]
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "data/xsmb.csv"
      - "requirements*.txt"
      - "pyproject.toml"
      - ".github/workflows/update-data.yml"
  repository_dispatch:
    # Đường chạy ĐÚNG GIỜ khi có bộ lập lịch bên ngoài gọi vào. Lịch của GitHub
    # chỉ là "cố gắng tốt nhất": trên kho này đo được độ trễ 2,5–4 giờ.
    types: [daily-finalize]
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for the immediate run"
        required: false
        default: "manual"
        type: string
  schedule:
    # Lịch tính theo UTC; Việt Nam là UTC+7. Giờ VN tương ứng: 18:33, 18:41,
    # 18:53, 19:07, 19:19, 19:27, 19:39, 19:51, 20:09.
    #
    # Phút lẻ là có chủ đích. Hàng đợi lịch của GitHub dồn nặng nhất ở phút :00
    # và :30, và độ trễ đo được trên kho này là 2,5–4 giờ (mốc 11:30 UTC thực
    # tế nổ lúc 13:57–15:27 UTC trong năm ngày liên tiếp). Rải ở phút lẻ giảm
    # bớt xác suất trượt chứ KHÔNG loại bỏ được độ trễ — đường chạy đúng giờ
    # chắc chắn là repository_dispatch ở trên.
    - cron: "33 11 * * *"
    - cron: "41 11 * * *"
    - cron: "53 11 * * *"
    - cron: "7 12 * * *"
    - cron: "19 12 * * *"
    - cron: "27 12 * * *"
    - cron: "39 12 * * *"
    - cron: "51 12 * * *"
    - cron: "9 13 * * *"

permissions:
  contents: read

concurrency:
  group: daily-xsmb-pipeline
  cancel-in-progress: false

jobs:
  # Ba chặng, để trang kết quả không phải chờ phân tích:
  #   canonical        lấy và commit kết quả chuẩn (vài chục giây sau khi live xác minh);
  #   publish-results  dựng lại ngay các trang kết quả và triển khai Pages;
  #   update           pipeline thống kê/AI/ML đầy đủ (~5 phút), rồi deploy-pages lần nữa.
  # Đo ngày 12-10-2026 khi còn là MỘT job: live xác minh 18:31:48, trang chủ có kết quả lúc
  # 18:41:20 — 3 phút chờ mốc 18:35 của sync.py, rồi 4,6 phút pipeline trước khi deploy.
  canonical:
    name: Chốt kết quả chuẩn
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      canonical_changed: ${{ steps.canonical_commit.outputs.canonical_changed }}
      canonical_ready: ${{ steps.canonical.outputs.ready }}
      target: ${{ steps.canonical.outputs.target }}
      finalized: ${{ steps.guard.outputs.finalized }}

    env:
      VN_LOTTERY_ROOT: ${{ github.workspace }}
      PYTHONPATH: ${{ github.workspace }}/src
      TZ: Asia/Ho_Chi_Minh
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VLA_CACHE_BUST: ${{ github.run_id }}

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Đồng bộ nhanh nhánh mặc định mới nhất
        run: git pull --ff-only origin "${GITHUB_REF_NAME}"

      - name: Thiết lập Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Xác định có cần hoàn tất dữ liệu hay không
        id: guard
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_REASON: ${{ inputs.reason || 'manual' }}
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import csv
          import os
          from datetime import datetime, time, timedelta
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("Asia/Ho_Chi_Minh"))
          # A draw is considered complete only after the 18:35 VN cutoff.
          # The live workflow can override this with reason=live_verified.
          target = now.date() if now.time() >= time(18, 35) else now.date() - timedelta(days=1)
          latest = ""
          try:
              with open("data/xsmb.csv", newline="", encoding="utf-8") as f:
                  latest = max(row["date"][:10] for row in csv.DictReader(f) if row.get("date"))
          except Exception:
              pass

          event_name = os.environ.get("EVENT_NAME", "")
          dispatch_reason = os.environ.get("DISPATCH_REASON", "manual")
          forced = event_name in {"workflow_dispatch", "repository_dispatch", "push"}
          live_verified = event_name == "workflow_dispatch" and dispatch_reason == "live_verified"
          if live_verified:
              target = now.date()
          should_run = forced or latest != target.isoformat()
          reason = "forced-" + dispatch_reason if forced else "scheduled-staleness"
          # Mỗi lượt live-results thấy kỳ đã xác minh đều gọi lại đây; ngày 12-10-2026 có SÁU
          # lượt hoàn tất cho cùng một kỳ, mỗi lượt ~8 phút, ba lượt viết lại dự báo LOTO đã công
          # bố. Kỳ hôm nay đã có trong sổ VÀ đã có dự báo cho kỳ kế tiếp thì pipeline không chạy
          # lại; nhưng triển khai Pages và hậu kiểm VẪN chạy lại (rẻ, lũy đẳng), vì hai tệp dự
          # báo chỉ chứng minh phân tích đã xong, không chứng minh hai chặng ấy đã thành công.
          # Pipeline hỏng giữa chừng thì chưa có dự báo kỳ sau, nên lượt gọi lại chạy đủ.
          next_day = (target + timedelta(days=1)).isoformat()
          finalized = live_verified and latest == target.isoformat() and all(
              os.path.exists(f"data/predict/predict_next_{mode}_all_{next_day}.csv")
              for mode in ("loto", "de")
          )
          if finalized:
              reason = "already-finalized"
          print(f"run={'true' if should_run else 'false'}")
          print(f"finalized={'true' if finalized else 'false'}")
          print(f"latest={latest}")
          print(f"target={target.isoformat()}")
          print(f"reason={reason}")
          PY

      - name: Cài đặt thư viện phụ thuộc
        if: steps.guard.outputs.run == 'true'
        run: |
          python -m pip install --upgrade --no-cache-dir pip wheel setuptools
          python -m pip install --no-cache-dir -r requirements.txt

      - name: Chờ kỳ quay chuẩn đã được xác minh
        id: canonical
        if: steps.guard.outputs.run == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_REASON: ${{ inputs.reason || 'manual' }}
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import json
          import os
          import subprocess
          import sys
          import time
          from datetime import datetime, time as dtime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          tz = ZoneInfo("Asia/Ho_Chi_Minh")
          output = Path(os.environ["GITHUB_OUTPUT"])
          event_name = os.environ.get("EVENT_NAME", "")
          dispatch_reason = os.environ.get("DISPATCH_REASON", "manual")
          live_verified = event_name == "workflow_dispatch" and dispatch_reason == "live_verified"
          deadline = time.monotonic() + 15 * 60

          def expected_target():
              now = datetime.now(tz)
              if live_verified:
                  return now.date()
              return now.date() if now.time() >= dtime(18, 35) else now.date() - timedelta(days=1)

          def latest_date():
              try:
                  with open("data/xsmb.csv", newline="", encoding="utf-8") as f:
                      values = [row["date"][:10] for row in csv.DictReader(f) if row.get("date")]
                  return max(values) if values else ""
              except Exception:
                  return ""

          def audit_ok(target):
              try:
                  audit = json.loads(Path("data/source_audit.json").read_text(encoding="utf-8"))
                  row = audit.get(target.isoformat(), {})
                  return bool(row.get("accepted")) and int(row.get("agreement", 0)) >= 1
              except Exception:
                  return False

          # sync.py chỉ lấy kỳ hôm nay khi đã qua mốc cutoff. Lượt live_verified tới trước
          # 18:35 (12-10-2026: 18:31:48) nên với mốc cố định nó quay khống ~3 phút. Live đã
          # xác minh kỳ hôm nay xong, nên mốc 00:00 cho sync lấy ngay; sổ chuẩn vẫn chỉ nhận
          # kết quả đủ 27 giải từ trang theo ngày.
          cutoff = "00:00" if live_verified else "18:35"

          while True:
              target = expected_target()
              latest = latest_date()

              if latest == target.isoformat() and (audit_ok(target) or event_name in {"push", "workflow_dispatch"}):
                  with output.open("a", encoding="utf-8") as f:
                      f.write("ready=true\n")
                      f.write(f"target={target.isoformat()}\n")
                  print(f"Canonical draw ready: {target} (latest={latest})")
                  break

              subprocess.run(
                  [
                      sys.executable,
                      "src/ingest/sync.py",
                      "--cutoff", cutoff,
                      "--fill-missing-days-back", "14",
                      "--max-retries", "1",
                      "--retry-backoff-s", "1.5",
                      "--consensus-min-recent", "1",
                      "--consensus-recent-days", "2",
                  ],
                  check=True,
              )

              latest = latest_date()
              if latest == target.isoformat() and audit_ok(target):
                  with output.open("a", encoding="utf-8") as f:
                      f.write("ready=true\n")
                      f.write(f"target={target.isoformat()}\n")
                  print(f"Verified canonical draw accepted: {target}")
                  break

              if time.monotonic() >= deadline:
                  with output.open("a", encoding="utf-8") as f:
                      f.write("ready=false\n")
                      f.write(f"target={target.isoformat()}\n")
                  print(f"No verified complete result yet for {target}; a later recovery schedule will retry.")
                  break

              print(f"Result not complete/verified yet for {target}; retrying in 25s...")
              time.sleep(25)
          PY

      - name: Ghi nhận kết quả chuẩn ngay lập tức
        id: canonical_commit
        if: steps.canonical.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/xsmb* data/source_audit.json data/excel
          if git diff --cached --quiet; then
            echo "Canonical result already committed."
            echo "canonical_changed=false" >> "$GITHUB_OUTPUT"
          else
            TARGET_DATE="${{ steps.canonical.outputs.target }}"
            git commit -m "data: finalize XSMB ${TARGET_DATE}"

            if [[ -n "$(git status --porcelain)" ]]; then
              echo "::error::Unexpected uncommitted files remain after canonical commit"
              git status --short
              exit 1
            fi

            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "canonical_changed=true" >> "$GITHUB_OUTPUT"
          fi

  publish-results:
    # Chỉ DỰNG các trang kết quả trên dữ liệu vừa chốt, không commit: pipeline ở job update
    # dựng lại chúng cùng mọi trang khác rồi deploy-pages triển khai bản đầy đủ. Phần dự báo
    # trên trang chủ trong vài phút ấy vẫn là dự báo đã công bố cho kỳ vừa quay.
    name: Xuất bản trang kết quả ngay
    needs: canonical
    if: ${{ github.event.repository.private == false && needs.canonical.outputs.canonical_ready == 'true' && needs.canonical.outputs.finalized != 'true' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      VN_LOTTERY_ROOT: ${{ github.workspace }}
      PYTHONPATH: ${{ github.workspace }}/src
      TZ: Asia/Ho_Chi_Minh
    steps:
      - name: Lấy commit kết quả chuẩn vừa đẩy
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Thiết lập Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Cài đặt thư viện phụ thuộc
        run: python -m pip install --no-cache-dir -r requirements.txt

      - name: Dựng các trang kết quả
        # Thứ tự có ràng buộc thật: ô "cầu đẹp nhất" cạnh bảng LOTO đọc soi cầu vị trí của
        # kỳ vừa quay, và bảng mô phỏng chèn vào trang chủ nên chạy SAU trang chủ.
        run: |
          set -euo pipefail
          python src/soi_cau/position_bridges.py
          python src/pages/build_position_bridges.py
          python src/pages/build_landing_page.py
          python src/pages/build_fun_prediction.py
          python src/pages/build_traditional_results.py

      - name: Cấu hình GitHub Pages
        uses: actions/configure-pages@v6

      - name: Chốt phiên bản và kiểm tra tài nguyên
        run: python3 src/web/site_assets.py --refresh docs --check

      - name: Tải artifact GitHub Pages lên
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-results-${{ github.run_attempt }}
          path: docs

      - name: Triển khai lên GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-results-${{ github.run_attempt }}

  update:
    name: Thống kê, AI/ML và mọi trang
    needs: canonical
    if: ${{ needs.canonical.outputs.canonical_ready == 'true' && needs.canonical.outputs.finalized != 'true' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      generated_changed: ${{ steps.commit.outputs.generated_changed }}
      canonical_changed: ${{ needs.canonical.outputs.canonical_changed }}
      canonical_ready: ${{ needs.canonical.outputs.canonical_ready }}

    env:
      VN_LOTTERY_ROOT: ${{ github.workspace }}
      PYTHONPATH: ${{ github.workspace }}/src
      TZ: Asia/Ho_Chi_Minh
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VLA_CACHE_BUST: ${{ github.run_id }}

    steps:
      - name: Lấy commit kết quả chuẩn vừa đẩy
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Thiết lập Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Cài đặt thư viện phụ thuộc
        run: |
          python -m pip install --upgrade --no-cache-dir pip wheel setuptools
          python -m pip install --no-cache-dir -r requirements.txt

      - name: Chạy quy trình hoàn tất đầu-cuối nghiêm ngặt
        run: |
          python src/pipeline.py \
            --cutoff 18:35 \
            --window-days 2000 \
            --display-days 10 \
            --lag-max 30 \
            --fill-missing-days-back 365 \
            --strict

      - name: Xác minh kỳ quay chuẩn mới nhất và tính liên tục
        run: |
          python src/evaluation/monitor_health.py \
            --health data/health.json \
            --cutoff 18:35 \
            --cutoff-aware \
            --max-staleness-days 0 \
            --fail-on-stale \
            --fail-on-missing

      - name: Xác minh các đầu ra đã tạo
        run: |
          test -s data/xsmb.csv
          test -s data/xsmb.json
          test -s data/source_audit.json
          test -s data/history/pred_loto.csv
          test -s data/history/pred_de.csv
          test -s data/significance/global_diagnostics.json
          test -s data/statistical_signal/predict_next_loto_stat_all.csv
          test -s data/statistical_signal/predict_next_de_stat_all.csv
          test -s models/ml_loto.joblib
          test -s models/ml_de.joblib
          test -s models/cau_keo_loto.joblib
          test -s models/cau_keo_de.joblib
          test -s docs/index.html
          test -s docs/statistics.html
          test -s docs/dashboard.html
          test -s docs/model-quality.html
          test -s docs/do-tin-cay.html
          test -s docs/soi-cau-vi-tri.html
          test -s docs/soi-cau-loto.html
          test -s docs/tao-phoi-tuan.html
          test -s docs/live.html
          test -s docs/so-ket-qua-truyen-thong.html
          test -s DASHBOARD.md

      - name: Ghi nhận phân tích và bảng điều khiển đã hoàn tất
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data models images docs README.md DASHBOARD.md
          if git diff --cached --quiet; then
            echo "No generated analytics changes to commit."
            echo "generated_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DATA_DATE="$(python -c 'import pandas as pd; df=pd.read_csv("data/xsmb.csv", usecols=["date"]); print(pd.to_datetime(df["date"]).max().date().isoformat())')"
          git commit -m "chore: finalize analytics ${DATA_DATE}"

          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::Unexpected uncommitted files remain after analytics commit"
            git status --short
            exit 1
          fi

          python3 scripts/ops/push_generated_site.py --branch "${GITHUB_REF_NAME}"
          echo "generated_changed=true" >> "$GITHUB_OUTPUT"

  trigger-post-finalization:
    name: Kích hoạt kiểm toán và đối soát trực tiếp
    needs: [canonical, update]
    # Lượt already-finalized bỏ pipeline (update = skipped) nhưng vẫn hậu kiểm lại.
    if: ${{ always() && needs.canonical.outputs.canonical_ready == 'true' && (needs.update.result == 'success' || (needs.update.result == 'skipped' && needs.canonical.outputs.finalized == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Gọi quy trình sau hoàn tất
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          branch = os.environ.get("DEFAULT_BRANCH") or "main"
          url = f"https://api.github.com/repos/{repo}/actions/workflows/post-finalization.yml/dispatches"
          payload = json.dumps({"ref": branch}).encode("utf-8")
          req = urllib.request.Request(
              url,
              data=payload,
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              if response.status != 204:
                  raise RuntimeError(f"post-finalization dispatch returned HTTP {response.status}")
          print("[OK] dispatched post-finalization.yml")
          PY

  deploy-pages:
    name: Triển khai bảng điều khiển đã làm mới (tùy chọn)
    # Chờ cả publish-results (thường đã xong từ lâu) để hai lượt triển khai không chồng nhau
    # và bản đầy đủ luôn là bản sau cùng; always() vì publish-results được phép hỏng.
    needs: [canonical, update, publish-results]
    if: ${{ always() && github.event.repository.private == false && needs.canonical.outputs.canonical_ready == 'true' && (needs.update.result == 'success' || (needs.update.result == 'skipped' && needs.canonical.outputs.finalized == 'true')) }}
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - name: Lấy commit dữ liệu mới tạo gần nhất
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Cấu hình GitHub Pages
        uses: actions/configure-pages@v6

      - name: Chốt phiên bản và kiểm tra tài nguyên
        run: python3 src/web/site_assets.py --refresh docs --check

      - name: Tải artifact GitHub Pages lên
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: docs

      - name: Triển khai lên GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

  verify-published-pages:
    # Bước "Xác minh các đầu ra" ở trên chỉ kiểm tệp CÓ TỒN TẠI. Ngày
    # 24-09-2026, mười lượt liên tiếp commit một docs/live.html dày thêm một
    # lớp khung mỗi lượt (1 → 11) mà không gì đỏ lên. Job này chạy các phép
    # kiểm bất biến của trang ngay trên commit vừa đẩy.
    #
    # Nó CỐ Ý không chặn dữ liệu hay triển khai: dữ liệu kỳ mới quan trọng hơn
    # hình dạng một trang, và deploy-pages không phụ thuộc job này. Việc của
    # nó là làm lượt chạy ĐỎ để lỗi được thấy ngay trong ngày.
    name: Kiểm bất biến các trang vừa xuất bản
    needs: update
    if: ${{ needs.update.result == 'success' && needs.update.outputs.generated_changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - name: Lấy commit dữ liệu mới tạo gần nhất
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Thiết lập Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Cài bộ chạy kiểm thử
        # Cùng mốc phiên bản với requirements.txt. scipy vì xsmb_domain nhập nó
        # (lười, trong hàm) — phép kiểm cây import tính cả nhánh ấy.
        run: python -m pip install --no-cache-dir "pytest>=9.1.1,<10" "beautifulsoup4==4.15.0" "numpy==2.2.6" "pandas==3.0.5" "scipy>=1.10,<2.0"

      - name: Một khung, không mã chết, không tham chiếu gãy, không lộ nguồn
        run: >-
          python -m pytest -q
          tests/web/test_app_shell.py
          tests/web/test_app_icons.py
          tests/site/test_published_assets.py
          tests/site/test_shipped_pages_are_clean.py

      # Chấm xác suất ĐÃ CÔNG BỐ với kết quả quay thật trên 60 kỳ gần nhất. Kỳ
      # quay đã kiểm là ngẫu nhiên, nên kỹ năng ngoài mẫu phải nằm trong vùng 0;
      # rời vùng theo hướng nào cũng làm lượt chạy đỏ — tệ hơn là hồi quy, tốt
      # hơn thì phải kiểm lại trước khi tin. Xem src/evaluation/skill_monitor.py.
      - name: Kỹ năng ngoài mẫu LOTO và Đặc Biệt còn trong vùng 0
        run: python src/evaluation/skill_monitor.py
