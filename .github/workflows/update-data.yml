name: Hoàn tất XSMB, thống kê và AI/ML

on:
  # Bootstrap a freshly published repository and re-run the production pipeline
  # whenever core code/config/data is intentionally changed on the default branch.
  push:
    branches: ["main", "master"]
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "data/xsmb.csv"
      - "requirements*.txt"
      - "pyproject.toml"
      - ".github/workflows/update-data.yml"
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for the immediate run"
        required: false
        default: "manual"
        type: string
  schedule:
    # IMPORTANT: keep schedules in UTC. Vietnam is UTC+7.
    # Multiple independent start windows reduce the chance that a delayed/dropped
    # GitHub scheduled event leaves the canonical daily result stale.
    # Local VN fallback times: 18:30, 18:40, 18:50, 19:00, 19:10,
    # 19:20, 19:30, 19:45 and 20:00.
    - cron: "30 11 * * *"
    - cron: "40 11 * * *"
    - cron: "50 11 * * *"
    - cron: "0 12 * * *"
    - cron: "10 12 * * *"
    - cron: "20 12 * * *"
    - cron: "30 12 * * *"
    - cron: "45 12 * * *"
    - cron: "0 13 * * *"

permissions:
  contents: read

concurrency:
  group: daily-xsmb-pipeline
  cancel-in-progress: false

jobs:
  update:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      generated_changed: ${{ steps.commit.outputs.generated_changed }}
      canonical_changed: ${{ steps.canonical_commit.outputs.canonical_changed }}
      canonical_ready: ${{ steps.canonical.outputs.ready }}

    env:
      VN_LOTTERY_ROOT: ${{ github.workspace }}
      PYTHONPATH: ${{ github.workspace }}/src
      TZ: Asia/Ho_Chi_Minh
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VLA_CACHE_BUST: ${{ github.run_id }}

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Đồng bộ nhanh nhánh mặc định mới nhất
        run: git pull --ff-only origin "${GITHUB_REF_NAME}"

      - name: Thiết lập Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Xác định có cần hoàn tất dữ liệu hay không
        id: guard
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_REASON: ${{ inputs.reason || 'manual' }}
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import csv
          import os
          from datetime import datetime, time, timedelta
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("Asia/Ho_Chi_Minh"))
          # A draw is considered complete only after the 18:35 VN cutoff.
          # The live workflow can override this with reason=live_verified.
          target = now.date() if now.time() >= time(18, 35) else now.date() - timedelta(days=1)
          latest = ""
          try:
              with open("data/xsmb.csv", newline="", encoding="utf-8") as f:
                  latest = max(row["date"][:10] for row in csv.DictReader(f) if row.get("date"))
          except Exception:
              pass

          event_name = os.environ.get("EVENT_NAME", "")
          dispatch_reason = os.environ.get("DISPATCH_REASON", "manual")
          forced = event_name in {"workflow_dispatch", "push"}
          live_verified = event_name == "workflow_dispatch" and dispatch_reason == "live_verified"
          if live_verified:
              target = now.date()
          should_run = forced or latest != target.isoformat()
          print(f"run={'true' if should_run else 'false'}")
          print(f"latest={latest}")
          print(f"target={target.isoformat()}")
          print(f"reason={'forced-' + dispatch_reason if forced else 'scheduled-staleness'}")
          PY

      - name: Cài đặt thư viện phụ thuộc
        if: steps.guard.outputs.run == 'true'
        run: |
          python -m pip install --upgrade --no-cache-dir pip wheel setuptools
          python -m pip install --no-cache-dir -r requirements.txt

      - name: Chờ kỳ quay chuẩn đã được xác minh
        id: canonical
        if: steps.guard.outputs.run == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_REASON: ${{ inputs.reason || 'manual' }}
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import json
          import os
          import subprocess
          import sys
          import time
          from datetime import datetime, time as dtime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          tz = ZoneInfo("Asia/Ho_Chi_Minh")
          output = Path(os.environ["GITHUB_OUTPUT"])
          event_name = os.environ.get("EVENT_NAME", "")
          dispatch_reason = os.environ.get("DISPATCH_REASON", "manual")
          live_verified = event_name == "workflow_dispatch" and dispatch_reason == "live_verified"
          deadline = time.monotonic() + 15 * 60

          def expected_target():
              now = datetime.now(tz)
              if live_verified:
                  return now.date()
              return now.date() if now.time() >= dtime(18, 35) else now.date() - timedelta(days=1)

          def latest_date():
              try:
                  with open("data/xsmb.csv", newline="", encoding="utf-8") as f:
                      values = [row["date"][:10] for row in csv.DictReader(f) if row.get("date")]
                  return max(values) if values else ""
              except Exception:
                  return ""

          def audit_ok(target):
              try:
                  audit = json.loads(Path("data/source_audit.json").read_text(encoding="utf-8"))
                  row = audit.get(target.isoformat(), {})
                  return bool(row.get("accepted")) and int(row.get("agreement", 0)) >= 2
              except Exception:
                  return False

          while True:
              target = expected_target()
              latest = latest_date()

              if latest == target.isoformat() and (audit_ok(target) or event_name in {"push", "workflow_dispatch"}):
                  with output.open("a", encoding="utf-8") as f:
                      f.write("ready=true\n")
                      f.write(f"target={target.isoformat()}\n")
                  print(f"Canonical draw ready: {target} (latest={latest})")
                  break

              subprocess.run(
                  [
                      sys.executable,
                      "src/sync.py",
                      "--cutoff", "18:35",
                      "--fill-missing-days-back", "14",
                      "--max-retries", "1",
                      "--retry-backoff-s", "1.5",
                      "--consensus-min-recent", "2",
                      "--consensus-recent-days", "2",
                  ],
                  check=True,
              )

              latest = latest_date()
              if latest == target.isoformat() and audit_ok(target):
                  with output.open("a", encoding="utf-8") as f:
                      f.write("ready=true\n")
                      f.write(f"target={target.isoformat()}\n")
                  print(f"Verified canonical draw accepted: {target}")
                  break

              if time.monotonic() >= deadline:
                  with output.open("a", encoding="utf-8") as f:
                      f.write("ready=false\n")
                      f.write(f"target={target.isoformat()}\n")
                  print(f"No verified complete result yet for {target}; a later recovery schedule will retry.")
                  break

              print(f"Result not complete/verified yet for {target}; retrying in 25s...")
              time.sleep(25)
          PY

      - name: Ghi nhận kết quả chuẩn ngay lập tức
        id: canonical_commit
        if: steps.canonical.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/xsmb* data/source_audit.json data/excel
          if git diff --cached --quiet; then
            echo "Canonical result already committed."
            echo "canonical_changed=false" >> "$GITHUB_OUTPUT"
          else
            TARGET_DATE="${{ steps.canonical.outputs.target }}"
            git commit -m "data: finalize XSMB ${TARGET_DATE}"

            if [[ -n "$(git status --porcelain)" ]]; then
              echo "::error::Unexpected uncommitted files remain after canonical commit"
              git status --short
              exit 1
            fi

            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "canonical_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Chạy quy trình hoàn tất đầu-cuối nghiêm ngặt
        if: steps.canonical.outputs.ready == 'true'
        run: |
          python src/pipeline.py \
            --cutoff 18:35 \
            --window-days 2000 \
            --display-days 10 \
            --lag-max 30 \
            --fill-missing-days-back 365 \
            --strict

      - name: Xác minh kỳ quay chuẩn mới nhất và tính liên tục
        if: steps.canonical.outputs.ready == 'true'
        run: |
          python src/monitor_health.py \
            --health data/health.json \
            --cutoff 18:35 \
            --cutoff-aware \
            --max-staleness-days 0 \
            --fail-on-stale \
            --fail-on-missing

      - name: Xác minh các đầu ra đã tạo
        if: steps.canonical.outputs.ready == 'true'
        run: |
          test -s data/xsmb.csv
          test -s data/xsmb.json
          test -s data/source_audit.json
          test -s data/history/pred_loto.csv
          test -s data/history/pred_de.csv
          test -s data/significance/global_diagnostics.json
          test -s data/statistical_signal/predict_next_loto_stat_all.csv
          test -s data/statistical_signal/predict_next_de_stat_all.csv
          test -s models/ml_loto.joblib
          test -s models/ml_de.joblib
          test -s models/cau_keo_loto.joblib
          test -s models/cau_keo_de.joblib
          test -s docs/index.html
          test -s docs/statistics.html
          test -s docs/dashboard.html
          test -s docs/model-quality.html
          test -s docs/live.html
          test -s DASHBOARD.md

      - name: Ghi nhận phân tích và bảng điều khiển đã hoàn tất
        id: commit
        if: steps.canonical.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data models images docs README.md DASHBOARD.md
          if git diff --cached --quiet; then
            echo "No generated analytics changes to commit."
            echo "generated_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DATA_DATE="$(python -c 'import pandas as pd; df=pd.read_csv("data/xsmb.csv", usecols=["date"]); print(pd.to_datetime(df["date"]).max().date().isoformat())')"
          git commit -m "chore: finalize analytics ${DATA_DATE}"

          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::Unexpected uncommitted files remain after analytics commit"
            git status --short
            exit 1
          fi

          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "generated_changed=true" >> "$GITHUB_OUTPUT"

  trigger-post-finalization:
    name: Kích hoạt kiểm toán và đối soát trực tiếp
    needs: update
    if: ${{ needs.update.result == 'success' && needs.update.outputs.canonical_ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Gọi quy trình sau hoàn tất
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          branch = os.environ.get("DEFAULT_BRANCH") or "main"
          url = f"https://api.github.com/repos/{repo}/actions/workflows/post-finalization.yml/dispatches"
          payload = json.dumps({"ref": branch}).encode("utf-8")
          req = urllib.request.Request(
              url,
              data=payload,
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              if response.status != 204:
                  raise RuntimeError(f"post-finalization dispatch returned HTTP {response.status}")
          print("[OK] dispatched post-finalization.yml")
          PY

  deploy-pages:
    name: Triển khai bảng điều khiển đã làm mới (tùy chọn)
    needs: update
    if: ${{ github.event.repository.private == false && needs.update.result == 'success' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Lấy commit dữ liệu mới tạo gần nhất
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Cấu hình GitHub Pages
        uses: actions/configure-pages@v6

      - name: Tải artifact GitHub Pages lên
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Triển khai lên GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
