name: VLM · Bộ cài engine Vietlott

# Chép từ VLM (.github/workflows/installer.yml), chạy trong `vietlott/`.
# Chạy chính các bộ cài trên Linux, macOS và Windows (PowerShell 5.1 qua install.cmd) khi chúng
# hoặc phần khởi động thay đổi, mỗi tuần một lần, và khi bấm tay. Tách khỏi CI vì phút chạy
# macOS / Windows đắt hơn.
on:
  push:
    branches: ["main"]
    paths:
      - "vietlott/install.sh"
      - "vietlott/install.ps1"
      - "vietlott/install.cmd"
      - "vietlott/pyproject.toml"
      - "vietlott/requirements*.txt"
      - "vietlott/src/vietlott_engine/cli.py"
      - "vietlott/src/vietlott_engine/paths.py"
      - ".github/workflows/vlm-installer.yml"
  pull_request:
    paths:
      - "vietlott/install.*"
      - "vietlott/pyproject.toml"
      - ".github/workflows/vlm-installer.yml"
  schedule:
    - cron: "25 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: vietlott

jobs:
  install:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: install.sh --dev (cài editable + chạy bộ test với .env bộ cài tạo)
        if: runner.os == 'Linux'
        run: bash install.sh --dev --skip-forecast --offline && ./vietlott doctor --offline
      - name: install.sh
        if: runner.os == 'macOS'
        run: bash install.sh --skip-forecast --offline && ./vietlott doctor --offline
      - name: install.cmd (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call install.cmd -SkipForecast -Offline || exit /b 1
          call vietlott.cmd doctor --offline
