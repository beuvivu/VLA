name: Bổ sung lịch sử KQXS

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Ngày đầu (YYYY-MM-DD), không sớm hơn 2015-01-01"
        required: true
        type: string
      end:
        description: "Ngày cuối (YYYY-MM-DD). Bỏ trống = hôm qua"
        required: false
        default: ""
        type: string
      delay_min:
        description: "Chờ tối thiểu giữa hai yêu cầu (giây)"
        required: false
        default: "1.5"
        type: string
      delay_max:
        description: "Chờ tối đa giữa hai yêu cầu (giây)"
        required: false
        default: "3.0"
        type: string

permissions:
  contents: read

concurrency:
  group: xsmb-backfill
  cancel-in-progress: false

jobs:
  backfill:
    name: Quét dải ngày và ghi vào kho
    runs-on: ubuntu-latest
    permissions:
      contents: write

    timeout-minutes: 360

    env:
      TZ: Asia/Ho_Chi_Minh
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v7

      - name: Thiết lập Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Cài thư viện
        run: python -m pip install --no-cache-dir -r requirements.txt

      - name: Số kỳ trước khi chạy
        run: |
          echo "Kỳ hiện có: $(($(wc -l < data/xsmb.csv) - 1))"

      - name: Chạy bổ sung lịch sử
        env:
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          DELAY_MIN: ${{ inputs.delay_min }}
          DELAY_MAX: ${{ inputs.delay_max }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$START" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "Ngày đầu không hợp lệ: $START" >&2; exit 1
          fi
          if [ -n "$END" ] && ! printf '%s' "$END" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "Ngày cuối không hợp lệ: $END" >&2; exit 1
          fi
          for delay in "$DELAY_MIN" "$DELAY_MAX"; do
            if ! printf '%s' "$delay" | grep -Eq '^[0-9]+(\.[0-9]+)?$'; then
              echo "Nhịp chờ không hợp lệ: $delay" >&2; exit 1
            fi
          done

          args=(--start "$START" --delay-min "$DELAY_MIN" --delay-max "$DELAY_MAX")
          if [ -n "$END" ]; then
            args+=(--end "$END")
          fi
          python src/ingest/backfill_history.py "${args[@]}"

      - name: Kiểm tính toàn vẹn dữ liệu sau khi bổ sung
        run: bash scripts/release/number_integrity_check.sh

      - name: Ghi nhận dữ liệu mới
        env:
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- data/; then
            echo "::notice::Không có kỳ nào mới."
            exit 0
          fi

          cp data/xsmb.json "${RUNNER_TEMP}/backfill-store.json"

          for attempt in 1 2 3 4 5; do
            git checkout -- data/
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"

            python src/ingest/backfill_history.py --merge-store "${RUNNER_TEMP}/backfill-store.json"

            if git diff --quiet -- data/; then
              echo "::notice::Nhánh chính đã có đủ dữ liệu; không cần ghi."
              exit 0
            fi

            rows=$(($(wc -l < data/xsmb.csv) - 1))
            git add data/
            git commit -m "data: bổ sung lịch sử KQXS (${START} → ${END:-hôm qua}), tổng ${rows} kỳ"
            if git push; then
              echo "::notice::Đã ghi ở lần thử ${attempt}. Tổng số kỳ: ${rows}"
              exit 0
            fi
            echo "::warning::Lần thử ${attempt} bị từ chối; nhánh chính vừa tiến lên. Hợp nhất lại."
            git reset --hard HEAD~1
            sleep $((attempt * 10))
          done

          echo "::error::Không đẩy được sau 5 lần thử."
          exit 1
