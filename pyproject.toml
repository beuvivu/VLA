[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.lint]
select = [
  "E9",
  "F",
  "B",
  "DTZ",
  "PLE",
  "NPY",
  "W",
  "PLW1510",
]

[tool.ruff.lint.per-file-ignores]
"tests/core/test_time_policy.py" = ["DTZ001"]
"tests/repo/test_security_hardening.py" = ["DTZ001"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
